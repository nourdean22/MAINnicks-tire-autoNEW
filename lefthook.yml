pre-commit:
  parallel: true
  commands:
    nickstire-lint-brand:
      root: "apps/nickstire"
      glob: "**/*.{ts,tsx,md}"
      run: pnpm run lint:brand-voice
    nickstire-lint-source:
      root: "apps/nickstire"
      glob: "**/*.{ts,tsx}"
      run: pnpm run lint:source
    nickstire-lint-hooks:
      root: "apps/nickstire"
      glob: "**/*.{ts,tsx}"
      run: pnpm run lint:hooks
    nickstire-validate-routes:
      root: "apps/nickstire"
      glob: "**/*.{ts,tsx}"
      run: pnpm run validate:routes
    nickstire-check:
      root: "apps/nickstire"
      glob: "**/*.{ts,tsx}"
      run: pnpm run check
    # 2026-09-16 gate-integrity: staged-only PII scan. It was already in
    # `pnpm run verify` and CI but in NO git hook, so no commit was ever
    # blocked on staged PII and the pre-commit mode the script implements
    # never actually ran at commit time.
    #
    # Measured before wiring: ~800ms in pre-commit mode, ~770ms in the audit
    # fallback over 919 files, and 1.05s inside this hook. It is the cheapest
    # job in this block by an order of magnitude — stated as a RELATION on
    # purpose, because an absolute number for a sibling job is a cache with no
    # invalidation (`nickstire-check` measured 52.9s cold and 8.04s warm on the
    # very commit that added this line).
    #
    # False-positive rate: 1 block across the last 120 commits touching
    # apps/nickstire/server/, and that one was a TRUE positive — the operator's
    # own mobile, hardcoded with no waiver. Expect ~1 commit in 120 to need one
    # `// pii-allow: <reason>` line.
    #
    # The glob is EXTENSION-ONLY on purpose. The script owns the scope
    # definition (`IN_SCOPE`: server/**, shared/**, scripts/**), and a glob
    # mirroring those directories would be a SECOND definition of scope, free
    # to drift from the first — the exact defect class the consent work this
    # gate ships beside was fixing. The cost of delegating is that a
    # client-only commit triggers the job, finds nothing in scope and falls
    # back to a non-blocking audit; that path is measured above, is labelled
    # `(audit)` in its own receipt, and cannot block. Do not "optimize" this
    # into a directory glob.
    #
    # Canary: apps/nickstire/server/lintPiiHookWiring.test.ts (11 tests, run
    # twice — clean env AND under a valid GIT_DIR, which is what git actually
    # exports to a hook).
    nickstire-lint-pii:
      root: "apps/nickstire"
      glob: "**/*.{ts,tsx,mjs,js}"
      run: pnpm run lint:pii
    statenour-typecheck:
      root: "apps/statenour"
      glob: "**/*.{ts,tsx}"
      run: pnpm run typecheck
    statenour-eslint:
      root: "apps/statenour"
      glob: "**/*.{ts,tsx,js,jsx}"
      run: pnpm run lint
    # 2026-07-25 gate-integrity: staged-only secret scan. The whole-repo
    # scanner (check:secrets) rightly flags local .env files, so it can
    # never gate a dev machine; --staged scans exactly what is about to
    # enter history, which is the leak surface that matters.
    statenour-secrets-staged:
      root: "apps/statenour"
      run: pnpm exec tsx scripts/scan-secrets.ts --staged
    # Agent OS: adapter parity + policy canaries, only when instruction/policy files are staged.
    # Node-only (no pnpm install needed) — see docs/agent-os/README.md.
    agent-os-verify:
      glob: "{AGENTS.md,CLAUDE.md,GEMINI.md,AGENT-OPERATING-PROFILE.md,CLAUDE-OPERATING-PROFILE.md,apps/*/AGENTS.md,apps/*/CLAUDE.md,.github/copilot-instructions.md,.cursor/rules/*,scripts/agent-os/*,config/agent-os/*,docs/codebase-memory-mcp.md,scripts/start-codebase-mcp.ps1}"
      run: node scripts/agent-os/verify.mjs

pre-push:
  commands:
    turbo-build-affected:
      run: pnpm run build:affected
