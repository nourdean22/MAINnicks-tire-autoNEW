    <!-- 2026-05-24 PSI fix · 3rd-party analytics moved off the critical
         path. PageSpeed Insights flagged mobile TBT 1090ms / desktop
         2640ms. All 3 analytics scripts now queue via requestIdleCallback
         (or setTimeout 2.5s on browsers without it) so they don't compete
         with React hydration during the initial main-thread window.
         · Meta Pixel · GA4 · Ahrefs Analytics
         All still fire · just AFTER the user-perceived performance
         window closes (Time to Interactive). -->
    <script>
      (function() {
        var idle = window.requestIdleCallback || function(cb) { return setTimeout(cb, 2500); };
        idle(function() {
          // Meta Pixel
          !function(f,b,e,v,n,t,s)
          {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
          n.callMethod.apply(n,arguments):n.queue.push(arguments)};
          if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
          n.queue=[];t=b.createElement(e);t.async=!0;
          t.src=v;s=b.getElementsByTagName(e)[0];
          s.parentNode.insertBefore(t,s)}(window, document,'script',
          'https://connect.facebook.net/en_US/fbevents.js');
          // PIXEL-ID FIX (2026-06-10): 1436350367898578 is the Meta APP id ('nour os' app),
          // NOT a pixel - Graph metadata-verified. The real dataset/pixel = 958472373260171
          // (created 2026-04-06). The browser pixel was init'd against the app id and
          // never tracked. Same root cause as every failed CAPI token (can't post events
          // to an app id).
          fbq('init', '958472373260171');
          fbq('track', 'PageView');

          // Google Analytics 4 (GA4)
          // BUG FIX (2026-06-10, GA4 wave): gtag was a LOCAL function inside
          // ga.onload — window.gtag never existed, so every custom event in
          // the codebase (lib/ga4.ts + SEO.tsx trackEvent, all guarded by
          // `typeof window.gtag === "function"`) silently skipped FOREVER.
          // GA4 admin confirmed: zero custom events ever received; only
          // automatic page_view/scroll (sent by the config hit) worked.
          // Canonical pattern: define dataLayer + window.gtag BEFORE the
          // script loads — early events queue in dataLayer and flush when
          // gtag.js arrives.
          window.dataLayer = window.dataLayer || [];
          window.gtag = function(){ window.dataLayer.push(arguments); };
          window.gtag('js', new Date());
          window.gtag('config', 'G-B1LJ1P43G8');
          var ga = document.createElement('script');
          ga.src = 'https://www.googletagmanager.com/gtag/js?id=G-B1LJ1P43G8';
          ga.async = true;
          document.head.appendChild(ga);

          // Ahrefs Analytics
          var ah = document.createElement('script');
          ah.src = 'https://analytics.ahrefs.com/analytics.js';
          ah.setAttribute('data-key', 'DCheKV/YJsF9d6vmJuHNBg');
          ah.async = true;
          document.head.appendChild(ah);
        }, { timeout: 4000 });
      })();
    </script>

    <!-- Preload Home hero image (full storefront sign + open bays) for fastest LCP.
         PSI fix 2026-05-24 · the preload MUST match the <picture> sources
         exactly or the browser double-downloads. Pre-fix mobile preloaded
         the 372KB full-size variant while <picture> rendered the 17KB
         -small variant · 22× bandwidth waste on the LCP path. Now the
         three media queries match Home.tsx <picture> sources 1-for-1.
         Same-origin webp = served via existing Brotli/gzip pipeline. -->
    <link rel="preload" as="image" href="/photos/shopfront-clear-vertical-sign-bays-small.webp" type="image/webp" media="(max-width: 768px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/photos/shopfront-clear-vertical-sign-bays-medium.webp" type="image/webp" media="(min-width: 769px) and (max-width: 1024px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/photos/shop-exterior-hero-wide-sign-bays.webp" type="image/webp" media="(min-width: 1025px)" fetchpriority="high" />

    <!-- Fonts: Inter (headings), Roboto Mono (body), Oswald (nav/labels).
         Multi-layer optimization to eliminate Lighthouse's ~80ms render-blocking flag:
         1. preconnect → opens TCP+TLS connection to fonts.gstatic.com early
         2. preload as=font for the LCP weight (Inter 800) → fetched in parallel
         3. CSS preload+onload swap → non-blocking stylesheet load
         4. font-display: swap → renders system font instantly, upgrades when Inter loads -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Direct woff2 preload for Inter 800 — the LCP H1 ("CLEVELAND TOUGH.") font.
         Without this the font-CSS gets parsed first, THEN the woff2 fetch starts.
         With this preload, both happen in parallel — the woff2 is cached by the
         time the CSS resolves which weights to apply. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="https://fonts.gstatic.com/s/inter/v18/UcCO3FwrK3iLTeHuS_nVMrMxCp50ojIv.woff2"
    />
    <!-- 2026-05-24 PSI CLS fix · display=swap → display=optional.
         The H1 LCP element uses Inter 800 (font-heading). With swap,
         the browser paints with fallback font, then re-paints with
         Inter when it loads · the metric mismatch (Inter is more
         compact than system sans) causes the H1 to re-wrap and shift
         surrounding content · CLS contribution.
         With optional, the H1 paints with fallback IMMEDIATELY and
         only upgrades to Inter if it's cached (cold loads never
         swap). Sacrifices brand fidelity on the cold-load path for
         CLS green. Trade-off documented per /web-performance-optim. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=Roboto+Mono:wght@400&family=Oswald:wght@500;700&display=optional"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>

        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=Roboto+Mono:wght@400&family=Oswald:wght@500;700&display=optional"
