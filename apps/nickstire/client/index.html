    <!-- 2026-05-24 PSI fix · 3rd-party analytics moved off the critical
         path. PageSpeed Insights flagged mobile TBT 1090ms / desktop
         2640ms. All 3 analytics scripts now queue via requestIdleCallback
         (or setTimeout 2.5s on browsers without it) so they don't compete
         with React hydration during the initial main-thread window.
         · Meta Pixel · GA4 · Ahrefs Analytics
         All still fire · just AFTER the user-perceived performance
         window closes (Time to Interactive). -->
    <script>
      (function() {
        var idle = window.requestIdleCallback || function(cb) { return setTimeout(cb, 2500); };
        idle(function() {
          // Meta Pixel
          !function(f,b,e,v,n,t,s)
          {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
          n.callMethod.apply(n,arguments):n.queue.push(arguments)};
          if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
          n.queue=[];t=b.createElement(e);t.async=!0;
          t.src=v;s=b.getElementsByTagName(e)[0];
          s.parentNode.insertBefore(t,s)}(window, document,'script',
          'https://connect.facebook.net/en_US/fbevents.js');
          // PIXEL-ID FIX (2026-06-10): 1436350367898578 is the Meta APP id ('nour os' app),
          // NOT a pixel - Graph metadata-verified. The real dataset/pixel = 958472373260171
          // (created 2026-04-06). The browser pixel was init'd against the app id and
          // never tracked. Same root cause as every failed CAPI token (can't post events
          // to an app id).
          fbq('init', '958472373260171');
          fbq('track', 'PageView');

          // Google Analytics 4 (GA4)
          // BUG FIX (2026-06-10, GA4 wave): gtag was a LOCAL function inside
          // ga.onload — window.gtag never existed, so every custom event in
          // the codebase (lib/ga4.ts + SEO.tsx trackEvent, all guarded by
          // `typeof window.gtag === "function"`) silently skipped FOREVER.
          // GA4 admin confirmed: zero custom events ever received; only
          // automatic page_view/scroll (sent by the config hit) worked.
          // Canonical pattern: define dataLayer + window.gtag BEFORE the
          // script loads — early events queue in dataLayer and flush when
          // gtag.js arrives.
          window.dataLayer = window.dataLayer || [];
          window.gtag = function(){ window.dataLayer.push(arguments); };
          window.gtag('js', new Date());
          window.gtag('config', 'G-B1LJ1P43G8');
          var ga = document.createElement('script');
          ga.src = 'https://www.googletagmanager.com/gtag/js?id=G-B1LJ1P43G8';
          ga.async = true;
          document.head.appendChild(ga);

          // Ahrefs Analytics
          var ah = document.createElement('script');
          ah.src = 'https://analytics.ahrefs.com/analytics.js';
          ah.setAttribute('data-key', 'DCheKV/YJsF9d6vmJuHNBg');
          ah.async = true;
          document.head.appendChild(ah);
        }, { timeout: 4000 });
      })();
    </script>

    <!-- Preload Home hero image (full storefront sign + open bays) for fastest LCP.
         PSI fix 2026-05-24 · the preload MUST match the <picture> sources
         exactly or the browser double-downloads. Pre-fix mobile preloaded
         the 372KB full-size variant while <picture> rendered the 17KB
         -small variant · 22× bandwidth waste on the LCP path. Now the
         three media queries match Home.tsx <picture> sources 1-for-1.
         Same-origin webp = served via existing Brotli/gzip pipeline. -->
    <link rel="preload" as="image" href="/photos/shopfront-clear-vertical-sign-bays-small.webp" type="image/webp" media="(max-width: 768px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/photos/shopfront-clear-vertical-sign-bays-medium.webp" type="image/webp" media="(min-width: 769px) and (max-width: 1024px)" fetchpriority="high" />
    <link rel="preload" as="image" href="/photos/shop-exterior-hero-wide-sign-bays.webp" type="image/webp" media="(min-width: 1025px)" fetchpriority="high" />

    <!-- Fonts: Barlow Condensed (headings/display), DM Sans (body),
         JetBrains Mono (stat numbers + micro-labels).
         These are the three families index.css:44-48 actually binds to
         --font-heading / --font-sans / --font-mono.

         KEEP THIS LIST AND index.css:44-48 IN SYNC. Until 2026-07-28 this
         tag fetched Inter + Roboto Mono + Oswald — none of which the
         stylesheet referenced — so every heading fell through to Oswald,
         all body copy rendered in the OS default instead of DM Sans, and
         Inter + a hardcoded Inter-800 woff2 preload were downloaded for
         zero elements. A families mismatch here fails SILENTLY: CSS
         font-family fallback chains exist precisely to suppress this
         error, so a broken pipeline degrades into looking intentional.
         Verify with DevTools → Network → filter "font", never by eye.

         1. preconnect → opens TCP+TLS to fonts.gstatic.com early
         2. CSS preload+onload swap → non-blocking stylesheet load
         3. display=swap → paints fallback instantly, upgrades on arrival

         No direct woff2 preload: the previous one hardcoded a hashed
         Google CDN path that went stale and pointed at an unused family.
         Hardcoding those paths is what produced this bug — preconnect
         plus the stylesheet preload gets most of the win without it. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 2026-05-24 set display=optional to stop the H1 re-wrapping (CLS).
         That rationale named "Inter 800" as the H1 font, but --font-heading
         has never contained Inter — so the swap it guarded against could not
         happen, and the setting only suppressed the real brand fonts on cold
         loads. Restored to swap: the hero owning the LCP H1 is height-locked
         (min-h-[100svh] flex items-center, Home.tsx), so a heading reflow
         resolves INSIDE the reserved box and contributes ~no document shift.
         Re-measure CLS on PSI if that hero stops being viewport-height. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
