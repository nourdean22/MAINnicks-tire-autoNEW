    <!-- Structured Data: LocalBusiness + AutoRepair + TireShop
         REMOVED 2026-05-03: was duplicating with the React LocalBusinessSchema
         component, causing GSC "Duplicate field FAQPage" errors on 14 pages.
         The React component is now the single source of truth — pulls from

         FAQPage error stems from this duplication; React component handles
         it correctly per-page. -->

    <!-- FAQPage schema removed from index.html in 2026-04 to prevent
         "duplicate FAQPage" structured data errors across the site. Each page
         that has FAQ content (Home, ServicePage, FAQ, BrakeRepair, etc.)
         renders its OWN FAQPage schema scoped to that page's questions. The
         shop-wide FAQ now lives only on the dedicated /faq route. -->

    <!-- Structured Data: WebSite with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Nick's Tire & Auto",
      "url": "https://nickstire.org",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://nickstire.org/tires?size={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Service schema (Premium Tire Installation Package) MOVED to Home.tsx
         (was previously hardcoded here — caused EVERY page to ship the same
         tire-specific Service schema even on /brakes, /diagnostics, /euclid-
         auto-repair, etc. That's the schema half of the March indexing crisis:
         Google saw 200+ pages all claiming to be the same Service entity.

         Each page now emits its OWN Service schema (Home: tire installation,
         FocusedServicePage: per-service via OfferCatalog + top-level Service,
         CityPage: AutoRepair area-served, etc.). LocalBusiness/AutoRepair
         schemas continue to render globally via LocalBusinessSchema component. -->

    <!-- FAQPage schema removed from index.html to prevent duplicate FAQPage errors.
         Each page renders its own FAQ schema via React components (ServicePage, FAQ, etc.) -->

    <!-- Preload Home hero image (full storefront sign + open bays) for fastest LCP.
         Mobile/desktop split via media-attribute preload — phones get the
         vertical sign-bays variant so the sign isn't cropped, desktop gets
         the wide hero. Same-origin webp = served via existing Brotli/gzip
         pipeline, no cross-origin DNS lookup. Updated 2026-05-06 wave-16
         to point at the new pro photo pack assets. -->
    <link rel="preload" as="image" href="/photos/shopfront-clear-vertical-sign-bays.webp" type="image/webp" media="(max-width: 768px)" />
    <link rel="preload" as="image" href="/photos/shop-exterior-hero-wide-sign-bays.webp" type="image/webp" media="(min-width: 769px)" />

    <!-- Fonts: Inter (headings), Roboto Mono (body), Oswald (nav/labels).
         Multi-layer optimization to eliminate Lighthouse's ~80ms render-blocking flag:
         1. preconnect → opens TCP+TLS connection to fonts.gstatic.com early
         2. preload as=font for the LCP weight (Inter 800) → fetched in parallel
         3. CSS preload+onload swap → non-blocking stylesheet load
         4. font-display: swap → renders system font instantly, upgrades when Inter loads -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Direct woff2 preload for Inter 800 — the LCP H1 ("CLEVELAND TOUGH.") font.
         Without this the font-CSS gets parsed first, THEN the woff2 fetch starts.
         With this preload, both happen in parallel — the woff2 is cached by the
         time the CSS resolves which weights to apply. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="https://fonts.gstatic.com/s/inter/v18/UcCO3FwrK3iLTeHuS_nVMrMxCp50ojIv.woff2"
    />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=Roboto+Mono:wght@400&family=Oswald:wght@500;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=Roboto+Mono:wght@400&family=Oswald:wght@500;700&display=swap"
      />
    </noscript>
