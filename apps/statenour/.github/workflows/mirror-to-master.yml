name: Mirror codex/ollama-local → statenour-master

# Auto-sync the production branch (statenour-master) to HEAD of
# codex/ollama-local AFTER CI passes. Eliminates the 312-commit drift
# problem documented in the v11 upgrade plan.
#
# Uses a fast-forward-only push so we never clobber master history.
# If a genuine conflict ever arises (someone pushed directly to master),
# the mirror will FAIL and require manual reconciliation — that is the
# correct behavior; master should be a linear ancestor of codex.

on:
  workflow_run:
    workflows: ["CI"]
    branches: [codex/ollama-local]
    types: [completed]
  workflow_dispatch:
    # Manual trigger for emergency sync.

concurrency:
  group: mirror-to-master
  cancel-in-progress: false

jobs:
  mirror:
    if: >-
      github.event.workflow_run.conclusion == 'success'
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/ollama-local

      - name: Configure git identity
        run: |
          git config user.name  "nour-ci-bot"
          git config user.email "ci@autonicks.com"

      - name: Fast-forward statenour-master to codex/ollama-local HEAD
        run: |
          set -e
          git fetch origin statenour-master:statenour-master
          CODEX_SHA=$(git rev-parse codex/ollama-local)
          MASTER_SHA=$(git rev-parse statenour-master)
          echo "codex=$CODEX_SHA"
          echo "master=$MASTER_SHA"

          if [ "$CODEX_SHA" = "$MASTER_SHA" ]; then
            echo "✅ master already at codex HEAD — nothing to mirror"
            exit 0
          fi

          # Fail-fast if master ever diverges (should never happen given
          # this workflow is the only writer). Manual intervention required.
          if ! git merge-base --is-ancestor "$MASTER_SHA" "$CODEX_SHA"; then
            echo "❌ statenour-master has diverged from codex/ollama-local"
            echo "   master commits not reachable from codex — refuse to overwrite"
            exit 1
          fi

          git push origin codex/ollama-local:statenour-master
          echo "✅ mirrored $CODEX_SHA → statenour-master"
