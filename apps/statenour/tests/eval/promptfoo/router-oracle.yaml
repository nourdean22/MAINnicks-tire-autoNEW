description: NOUR capability-router safety oracle

prompts:
  - "{{case}}"

providers:
  - "exec: node --import tsx router-provider.ts"

tests:
  - description: AUTO never silently selects metered paid without consent
    vars:
      case: >-
        {"request":{"capability":"coder","mode":"AUTO","explicitMeteredConsent":false},"lanes":[{"id":"paid","provider":"api","capabilities":["coder"],"kind":"api_inference","authClass":"api_metered","costClass":"METERED_PAID","privacyClass":"external_provider","health":"ready","quota":"available","priority":0},{"id":"subscription","provider":"subscription","capabilities":["coder"],"kind":"subscription_agent","authClass":"subscription","costClass":"SUBSCRIPTION_INCLUDED","privacyClass":"external_provider","health":"ready","quota":"available","priority":10}]}
    assert:
      - type: javascript
        metric: auto_no_metered
        value: >-
          (() => { const x = JSON.parse(output); return x.selectedIds[0] === "subscription" && !x.selectedCostClasses.includes("METERED_PAID"); })()

  - description: AUTO fails closed when only metered paid is available
    vars:
      case: >-
        {"request":{"capability":"coder","mode":"AUTO","explicitMeteredConsent":false},"lanes":[{"id":"paid","provider":"api","capabilities":["coder"],"kind":"api_inference","authClass":"api_metered","costClass":"METERED_PAID","privacyClass":"external_provider","health":"ready","quota":"available","priority":0}]}
    assert:
      - type: javascript
        metric: auto_paid_only_fails_closed
        value: >-
          (() => { const x = JSON.parse(output); return x.selectedIds.length === 0; })()

  - description: MAX may select metered paid when explicitly requested
    vars:
      case: >-
        {"request":{"capability":"coder","mode":"MAX","explicitMeteredConsent":true},"lanes":[{"id":"paid","provider":"api","capabilities":["coder"],"kind":"api_inference","authClass":"api_metered","costClass":"METERED_PAID","privacyClass":"external_provider","health":"ready","quota":"available","priority":0}]}
    assert:
      - type: javascript
        metric: max_paid_explicit
        value: >-
          (() => { const x = JSON.parse(output); return x.selectedIds[0] === "paid"; })()

  - description: exhausted subscription lane falls through to local free
    vars:
      case: >-
        {"request":{"capability":"coder","mode":"AUTO","explicitMeteredConsent":false},"lanes":[{"id":"codex","provider":"openai-codex","capabilities":["coder"],"kind":"subscription_agent","authClass":"subscription","costClass":"SUBSCRIPTION_INCLUDED","privacyClass":"external_provider","health":"ready","quota":"exhausted","priority":0},{"id":"local","provider":"nour-local","capabilities":["coder"],"kind":"local_inference","authClass":"local","costClass":"LOCAL_FREE","privacyClass":"local_only","health":"ready","quota":"available","priority":50}]}
    assert:
      - type: javascript
        metric: quota_fallback
        value: >-
          (() => { const x = JSON.parse(output); return x.selectedIds.join(",") === "local"; })()

  - description: FREE rejects paid and keeps local lane
    vars:
      case: >-
        {"request":{"capability":"coder","mode":"FREE","explicitMeteredConsent":false},"lanes":[{"id":"paid","provider":"api","capabilities":["coder"],"kind":"api_inference","authClass":"api_metered","costClass":"METERED_PAID","privacyClass":"external_provider","health":"ready","quota":"available","priority":0},{"id":"local","provider":"nour-local","capabilities":["coder"],"kind":"local_inference","authClass":"local","costClass":"LOCAL_FREE","privacyClass":"local_only","health":"ready","quota":"available","priority":50}]}
    assert:
      - type: javascript
        metric: free_mode
        value: >-
          (() => { const x = JSON.parse(output); return x.selectedIds.join(",") === "local"; })()

  - description: local-only privacy excludes external subscription lanes
    vars:
      case: >-
        {"request":{"capability":"coder","mode":"AUTO","maxPrivacyClass":"local_only","explicitMeteredConsent":false},"lanes":[{"id":"subscription","provider":"subscription","capabilities":["coder"],"kind":"subscription_agent","authClass":"subscription","costClass":"SUBSCRIPTION_INCLUDED","privacyClass":"external_provider","health":"ready","quota":"available","priority":0},{"id":"local","provider":"nour-local","capabilities":["coder"],"kind":"local_inference","authClass":"local","costClass":"LOCAL_FREE","privacyClass":"local_only","health":"ready","quota":"available","priority":50}]}
    assert:
      - type: javascript
        metric: privacy_boundary
        value: >-
          (() => { const x = JSON.parse(output); return x.selectedIds.join(",") === "local"; })()
