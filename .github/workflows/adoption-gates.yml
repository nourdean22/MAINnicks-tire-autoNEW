name: Adoption gates

# ast-grep + dependency-cruiser + curdate (blocking), adopted via
# docs/UPSTREAMS.md rows dated 2026-08-27. The two knip gates (blocking since 2026-08-27, despite the old
# "advisory" job label) now run as steps of `node` in test.yml (2026-10-16 CI diet). This job is install-free:
# every tool runs through version-pinned `pnpm dlx`, so nothing here touches
# pnpm-lock.yaml or a junctioned worktree.
#
# Every gate ships its canary in-line (root AGENTS.md "Ship the canary, not
# just the control"): a known-bad fixture MUST fail before the real scan's
# green is trusted, so a gate that silently stops seeing violations turns
# this job red instead of rotting.
#
# NOTE: this repo has no branch protection, so a red run does not
# mechanically block `gh pr merge`. Red means stop, by convention.

# 2026-10-16 · CI diet.
#  - paths-ignore: a diff that only touches markdown or the root docs/ tree cannot change what these gates
#    scan (apps/statenour app/components/features/hooks/lib, apps/nickstire client + server SQL, knip's
#    graph, config/adoption-gates), so it skips them instead of billing ~5 minutes. Any code file in the
#    same diff runs them. workflowCostGuards.test.mjs asserts no scanned directory is ever ignored.
#  - the curdate gate was its own 16-second job, billed as a full minute. It needs no install, same as
#    static-gates, so its steps live here now, unchanged. `!cancelled()` keeps both verdicts visible when
#    the first half is red, as the separate jobs did.
#  - PR only: the PR head already ran these gates on the merge result, and a push to main re-ran the same
#    scan for ~5.4 billed minutes a merge. No push trigger means no main run to cancel; PR pushes
#    supersede each other. `node` in test.yml stays on main as the safety net.
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adoption-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-gates:
    name: ast-grep + dependency-cruiser + curdate (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: canary - ast-grep must fail on the bad fixtures, on the RULE
        run: |
          # Exit code alone is not enough: a config error also exits nonzero
          # (probed 2026-08-27, TS18003 shape in the depcruise twin). The
          # canary passes only if the run fails AND names the rule.
          out=$(pnpm --package=@ast-grep/cli@0.45.2 dlx ast-grep scan -c config/adoption-gates/sgconfig.yml config/adoption-gates/fixtures/bad 2>&1) && {
            echo "::error::ast-grep canary scanned known-bad fixtures clean - the gate is blind, do not trust its green"; exit 1; } || true
          echo "$out" | grep -q "no-native-dialogs" || {
            echo "::error::ast-grep canary failed for the wrong reason (config error, not the rule):"; echo "$out"; exit 1; }
          echo "canary OK: ast-grep still sees native-dialog violations"

      - name: gate - no native dialogs in either PWA's client code
        # apps/statenour/hooks and apps/statenour/lib were MISSING here until
        # 2026-09-10. hooks/ is 32 of 32 files "use client"; lib/ holds 9 more.
        # So 41 client files sat outside a gate whose own job description
        # (AGENTS.md enforcement map) says it blocks native dialogs in BOTH
        # PWAs' CLIENT TREES. The canary above proves the RULE fires; nothing
        # proved the SCAN LIST covers the code - which is why
        # scripts/agent-os/dialogGateCoverage.test.mjs now asserts exactly that.
        run: pnpm --package=@ast-grep/cli@0.45.2 dlx ast-grep scan -c config/adoption-gates/sgconfig.yml apps/statenour/app apps/statenour/components apps/statenour/features apps/statenour/hooks apps/statenour/lib apps/nickstire/client/src

      - name: canary - dependency-cruiser must fail on the bad fixtures, on the RULES
        run: |
          DC="pnpm --package=dependency-cruiser@18.2.0 --package=typescript@5 dlx depcruise --config config/adoption-gates/.dependency-cruiser.cjs"
          out=$($DC config/adoption-gates/fixtures/bad 2>&1) && {
            echo "::error::dependency-cruiser canary - deprecated-card fixture scanned clean; the gate is blind"; exit 1; } || true
          echo "$out" | grep -q "no-deprecated-card" || {
            echo "::error::depcruise canary failed for the wrong reason (config error, not the rule):"; echo "$out"; exit 1; }
          cp config/adoption-gates/fixtures/bad/reverse-import-canary.ts.txt apps/statenour/features/__depcruise_canary__.ts
          out=$($DC apps/statenour/features/__depcruise_canary__.ts 2>&1) && {
            rm apps/statenour/features/__depcruise_canary__.ts
            echo "::error::dependency-cruiser canary - reverse-layer fixture scanned clean; the gate is blind"; exit 1; } || true
          rm apps/statenour/features/__depcruise_canary__.ts
          echo "$out" | grep -q "no-reverse-layer-imports" || {
            echo "::error::depcruise reverse canary failed for the wrong reason:"; echo "$out"; exit 1; }
          echo "canary OK: dependency-cruiser still sees both violation shapes"

      - name: gate - layer boundaries + deprecated-card ban
        run: pnpm --package=dependency-cruiser@18.2.0 --package=typescript@5 dlx depcruise --config config/adoption-gates/.dependency-cruiser.cjs apps/statenour/app apps/statenour/components apps/statenour/features apps/statenour/lib

      # ─── curdate gate (was its own job, `curdate gate (no new bare CURDATE() in server SQL)`) ───
      # No install: the gate is node stdlib only.

      # Two planted sites: the bare CURDATE() and one widened spelling, DATE(NOW()).
      # A nonzero exit alone proves nothing (a crash or a bad flag exits nonzero
      # too), so stderr must name the rule AND list each planted site.
      - name: canary - the gate must FAIL on a planted CURDATE()
        if: ${{ !cancelled() }}
        run: |
          cd apps/nickstire
          cp server/services/shopSales.ts server/services/shopSales.ts.bak
          printf '\nexport const __curdateCanary__ = "SELECT CURDATE()";\nexport const __curdateCanaryWide__ = "SELECT DATE(NOW())";\n' >> server/services/shopSales.ts
          status=0
          node scripts/lint-curdate.mjs > "$RUNNER_TEMP/curdate.out" 2> "$RUNNER_TEMP/curdate.err" || status=$?
          mv server/services/shopSales.ts.bak server/services/shopSales.ts
          if [ "$status" -ne 1 ]; then
            cat "$RUNNER_TEMP/curdate.err"
            echo "::error::curdate gate canary - exit $status on planted sites, expected 1; the gate is blind or broken"
            exit 1
          fi
          # The expanded headline exists only in real output (the source holds ${RULE}), so a
          # crash that echoes the offending source line cannot satisfy it.
          grep -qF "NEW site(s): a calendar date computed from the UTC DB clock" "$RUNNER_TEMP/curdate.err" || {
            cat "$RUNNER_TEMP/curdate.err"
            echo "::error::curdate gate canary - it failed without naming the rule; a crash is not a catch"
            exit 1
          }
          grep -qE 'L[0-9]+ +CURDATE\(\)' "$RUNNER_TEMP/curdate.err" || {
            cat "$RUNNER_TEMP/curdate.err"
            echo "::error::curdate gate canary - the planted CURDATE() was not listed"
            exit 1
          }
          grep -qE 'L[0-9]+ +DATE\(NOW\(\)' "$RUNNER_TEMP/curdate.err" || {
            cat "$RUNNER_TEMP/curdate.err"
            echo "::error::curdate gate canary - the planted DATE(NOW()) was not listed; the widened matcher is blind"
            exit 1
          }
          echo "canary ok - both planted spellings were caught and the rule was named"

      - name: canary - the gate must PASS on a clean tree
        if: ${{ !cancelled() }}
        run: |
          cd apps/nickstire
          node scripts/lint-curdate.mjs > "$RUNNER_TEMP/curdate-clean.out" || {
            echo "::error::curdate gate reports failure on an unmodified tree - the gate is stuck red"
            exit 1
          }
          # Exit 0 must come from a scan that ran: the pass line is printed only after one.
          grep -qE '[0-9]+ file\(s\) scanned' "$RUNNER_TEMP/curdate-clean.out" && grep -qF "no new site" "$RUNNER_TEMP/curdate-clean.out" || {
            cat "$RUNNER_TEMP/curdate-clean.out"
            echo "::error::curdate gate exited 0 without its pass line - it did not scan"
            exit 1
          }
          echo "canary ok - clean tree passes"

      - name: gate - no NEW bare CURDATE()
        if: ${{ !cancelled() }}
        run: cd apps/nickstire && node scripts/lint-curdate.mjs
