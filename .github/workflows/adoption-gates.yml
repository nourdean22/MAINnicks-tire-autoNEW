name: Adoption gates

# ast-grep + dependency-cruiser (blocking) and knip (advisory), adopted via
# docs/UPSTREAMS.md rows dated 2026-08-27. The blocking job is install-free:
# every tool runs through version-pinned `pnpm dlx`, so nothing here touches
# pnpm-lock.yaml or a junctioned worktree.
#
# Every gate ships its canary in-line (root AGENTS.md "Ship the canary, not
# just the control"): a known-bad fixture MUST fail before the real scan's
# green is trusted, so a gate that silently stops seeing violations turns
# this job red instead of rotting.
#
# NOTE: this repo has no branch protection, so a red run does not
# mechanically block `gh pr merge`. Red means stop, by convention.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adoption-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-gates:
    name: ast-grep + dependency-cruiser (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: canary - ast-grep must fail on the bad fixtures, on the RULE
        run: |
          # Exit code alone is not enough: a config error also exits nonzero
          # (probed 2026-08-27, TS18003 shape in the depcruise twin). The
          # canary passes only if the run fails AND names the rule.
          out=$(pnpm --package=@ast-grep/cli@0.45.2 dlx ast-grep scan -c config/adoption-gates/sgconfig.yml config/adoption-gates/fixtures/bad 2>&1) && {
            echo "::error::ast-grep canary scanned known-bad fixtures clean - the gate is blind, do not trust its green"; exit 1; } || true
          echo "$out" | grep -q "no-native-dialogs" || {
            echo "::error::ast-grep canary failed for the wrong reason (config error, not the rule):"; echo "$out"; exit 1; }
          echo "canary OK: ast-grep still sees native-dialog violations"

      - name: gate - no native dialogs in either PWA's client code
        run: pnpm --package=@ast-grep/cli@0.45.2 dlx ast-grep scan -c config/adoption-gates/sgconfig.yml apps/statenour/app apps/statenour/components apps/statenour/features apps/nickstire/client/src

      - name: canary - dependency-cruiser must fail on the bad fixtures, on the RULES
        run: |
          DC="pnpm --package=dependency-cruiser@18.2.0 --package=typescript@5 dlx depcruise --config config/adoption-gates/.dependency-cruiser.cjs"
          out=$($DC config/adoption-gates/fixtures/bad 2>&1) && {
            echo "::error::dependency-cruiser canary - deprecated-card fixture scanned clean; the gate is blind"; exit 1; } || true
          echo "$out" | grep -q "no-deprecated-card" || {
            echo "::error::depcruise canary failed for the wrong reason (config error, not the rule):"; echo "$out"; exit 1; }
          cp config/adoption-gates/fixtures/bad/reverse-import-canary.ts.txt apps/statenour/features/__depcruise_canary__.ts
          out=$($DC apps/statenour/features/__depcruise_canary__.ts 2>&1) && {
            rm apps/statenour/features/__depcruise_canary__.ts
            echo "::error::dependency-cruiser canary - reverse-layer fixture scanned clean; the gate is blind"; exit 1; } || true
          rm apps/statenour/features/__depcruise_canary__.ts
          echo "$out" | grep -q "no-reverse-layer-imports" || {
            echo "::error::depcruise reverse canary failed for the wrong reason:"; echo "$out"; exit 1; }
          echo "canary OK: dependency-cruiser still sees both violation shapes"

      - name: gate - layer boundaries + deprecated-card ban
        run: pnpm --package=dependency-cruiser@18.2.0 --package=typescript@5 dlx depcruise --config config/adoption-gates/.dependency-cruiser.cjs apps/statenour/app apps/statenour/components apps/statenour/features apps/statenour/lib

  knip-advisory:
    name: knip reachability census (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: install (statenour dependency graph only)
        run: pnpm install --frozen-lockfile --filter "@statenour/web..."

      - name: canary - knip must fail on a planted unused file
        run: |
          echo "export const knipCanary = 1" > apps/statenour/lib/__knip_canary__.ts
          if pnpm dlx knip@6.32.3 --workspace apps/statenour --include files > /dev/null 2>&1; then
            rm apps/statenour/lib/__knip_canary__.ts
            echo "::error::knip canary - a planted unused file scanned clean; the census is blind"
            exit 1
          fi
          rm apps/statenour/lib/__knip_canary__.ts
          echo "canary OK: knip still sees unreachable files"

      - name: knip reachability gate - zero unused files (blocking since 2026-08-27)
        run: |
          echo "## knip reachability gate - apps/statenour (blocking)" >> "$GITHUB_STEP_SUMMARY"
          # GH Actions bash runs with pipefail, so knip's exit survives the tee.
          pnpm dlx knip@6.32.3 --workspace apps/statenour --reporter markdown | tee -a "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "_Blocking since the 2026-08-27 wire-or-delete wave took the census 341 -> 0 (172 scripts declared as entries, 134 dead files deleted, 24 dynamic-referenced keeps in knip.json ignore with receipts). A new finding = a genuinely unreachable new file: wire it or delete it, never grow the ignore list without a path-reference receipt._" >> "$GITHUB_STEP_SUMMARY"

  knip-orphan-gate:
    name: knip orphan gate (no new unconsumed exports/files/scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: install (nickstire dependency graph only)
        run: pnpm install --frozen-lockfile --filter "nicks-tire-auto..."

      # The gate sets its own dummy DATABASE_URL (knip loads drizzle.config.ts as
      # a config file; nothing connects).

      - name: canary - the gate must FAIL on a planted orphan
        run: |
          cd apps/nickstire
          cp shared/reelScore.ts shared/reelScore.ts.bak
          printf '\nexport function __orphanCanary__() { return 1; }\n' >> shared/reelScore.ts
          if node scripts/knip-orphan-gate.mjs > /dev/null 2>&1; then
            mv shared/reelScore.ts.bak shared/reelScore.ts
            echo "::error::knip-orphan-gate canary - a planted unconsumed export scanned clean; the gate is blind"
            exit 1
          fi
          mv shared/reelScore.ts.bak shared/reelScore.ts
          echo "canary ok - planted orphan was caught"

      - name: canary - the gate must PASS on a clean tree
        run: |
          cd apps/nickstire
          node scripts/knip-orphan-gate.mjs > /dev/null || {
            echo "::error::knip-orphan-gate reports failure on an unmodified tree - the gate is stuck red"
            exit 1
          }
          echo "canary ok - clean tree passes"

      - name: gate - no NEW unconsumed exports, files, or scripts
        run: cd apps/nickstire && node scripts/knip-orphan-gate.mjs
