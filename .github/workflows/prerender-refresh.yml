name: Prerender refresh

# Weekly regen of prerendered/ HTML. Ensures Googlebot sees fresh content
# for every route even when no code has changed (e.g., service.ts copy
# updates, new blog posts, review count changes in headers). Auto-commits
# back to main if the HTML changed. Does NOT run during deploys — Railway
# stays fast because we serve the committed prerendered/ files as-is.
#
# Schedule: Sunday 3 AM Eastern (08:00 UTC) — before the work-week traffic
# surge and avoids stepping on any dev/deploy windows.

on:
  schedule:
    - cron: "0 8 * * 0" # Sunday 08:00 UTC
  workflow_dispatch: {} # Manual trigger from Actions tab

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      NODE_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # The prerender server needs real env at minimum — inject the bare
      # minimum for the routes to render. Add more here if a route errors.
      AUTO_LABOR_USERNAME: ${{ secrets.AUTO_LABOR_USERNAME }}
      AUTO_LABOR_PASSWORD: ${{ secrets.AUTO_LABOR_PASSWORD }}
      GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
      GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      OWNER_OPEN_ID: ${{ secrets.OWNER_OPEN_ID }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.VITE_GOOGLE_OAUTH_CLIENT_ID }}
      CEO_EMAIL: ${{ secrets.CEO_EMAIL }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Needed so the auto-commit step can push back
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Regenerate prerendered HTML (all 180 routes)
        run: pnpm run regen

      - name: Check if anything changed
        id: diff
        run: |
          if git diff --quiet prerendered/; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes in prerendered/"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            git diff --stat prerendered/ | tail -5
          fi

      - name: Commit + push if changed
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "prerender-bot"
          git config user.email "prerender-bot@nickstire.org"
          git add prerendered/
          git commit -m "chore(prerender): weekly auto-regen [skip ci]

          Automated via .github/workflows/prerender-refresh.yml.
          Refreshes static HTML for Googlebot. Railway redeploys on push."
          git push origin main

      - name: Summary
        if: always()
        run: |
          echo "### Prerender regen summary" >> $GITHUB_STEP_SUMMARY
          echo "- Changed: ${{ steps.diff.outputs.changed }}" >> $GITHUB_STEP_SUMMARY
          echo "- Prerendered dir: $(find prerendered -name 'index.html' | wc -l) files" >> $GITHUB_STEP_SUMMARY
