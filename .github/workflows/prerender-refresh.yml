name: Prerender refresh

# Regenerates apps/nickstire/prerendered/*.html and commits the result.
#
# Why this exists: nickstire serves COMMITTED prerendered HTML to crawlers,
# and Railway deploys do not regenerate it (PRERENDER_ON_BUILD is off, for
# fast deploys). Without a periodic refresh the prerendered tree silently
# drifts stale vs source — schema, meta-description and NAP changes never
# reach Googlebot. scripts/build-maybe-prerender.mjs references this job.
#
# REQUIRED repo secrets (Settings -> Secrets and variables -> Actions):
#   DATABASE_URL  the regen boots the prod server to prerender against it
# All other REQUIRED_ENV vars (server/_core/index.ts) are boot-only here and
# get >=32-char dummies below — prerender renders public pages and never
# authenticates. The regen self-restores prerendered/ if it aborts, so a
# failed run is safe — it just leaves the committed tree untouched. The
# runner must be able to reach the database; if TiDB has IP allowlisting,
# allow GitHub Actions IPs.

on:
  schedule:
    - cron: "0 8 * * 1"        # Mondays, 08:00 UTC
  workflow_dispatch: {}          # manual "Run workflow" button

permissions:
  contents: write                # commit the regenerated prerendered/

concurrency:
  group: prerender-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The server bundle imports workspace packages (@nour/gbp-publisher,
      # @nour/utils) as externals resolved via node_modules symlinks — their
      # dist/ must exist or the server dies at import with
      # ERR_MODULE_NOT_FOUND before it can even validate env. This is what
      # actually killed runs #21-#25 (run #25's boot log finally showed it);
      # the regen script builds only the app, not its workspace deps.
      # "^..." = dependencies of the app, excluding the app itself.
      - name: Build workspace packages (server runtime deps)
        run: pnpm exec turbo run build --filter "nicks-tire-auto^..."

      - name: Regenerate prerendered HTML
        working-directory: apps/nickstire
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRERENDER_RO || secrets.DATABASE_URL }}
          # Without this, every refresh STRIPS the live Google reviews from
          # /reviews: getGoogleReviews() returns nothing, the page renders
          # "No reviews match your filters", and 5 real review cards leave the
          # crawler-visible HTML. Measured 2026-08-15 (133KB/5 cards -> 107KB/0).
          # The homepage survives only because it falls back to FALLBACK_REVIEWS.
          # Harmless while the secret is unset (empty string = today's behaviour).
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          # Boot-only dummies. server/_core/index.ts REQUIRED_ENV hard-exits
          # without OWNER_OPEN_ID / ADMIN_API_KEY / STATENOUR_SYNC_KEY and
          # enforces >=32 chars on the key material (the old 31-char
          # JWT_SECRET failed that check). Required for boot — though run
          # #25 showed the FIRST killer was the unbuilt workspace deps
          # above; this gate is what the server checks right after imports.
          JWT_SECRET: "prerender-dummy-jwt-secret-not-used-1234567890"
          ADMIN_API_KEY: "prerender-dummy-admin-key-not-used-1234567890"
          STATENOUR_SYNC_KEY: "prerender-dummy-sync-key-not-used-1234567890"
          OWNER_OPEN_ID: "prerender-dummy-owner"
        run: pnpm run regen

      # The regen script points at this log when the server fails to boot,
      # but it was never surfaced in CI — runs #21-#23 failed blind.
      # ALWAYS, not `if: failure()`. The 2026-09-10 refresh SUCCEEDED — 333 of 339
      # routes rendered — while six DB-backed blog routes rendered their
      # not-found branch inside a 90-second window ~14 minutes in. The cause of
      # that lives in the server log, and this step was gated on job failure, so
      # the run that most needed it threw it away. A partially-degraded run is
      # exactly the case where the log is worth having and the only case where
      # `if: failure()` withholds it.
      #
      # Tail, not the whole file: it is a full prod-server boot log and the last
      # 200 lines carry the DB errors that matter.
      - name: Server log (always — a green run can still have failed routes)
        if: always()
        run: tail -n 200 apps/nickstire/tmp/regen-server.log || true

      # ── Gate the artifacts BEFORE they reach main ──────────────────────
      #
      # This job pushes straight to a branch — there is no PR, so none of the
      # checks that guard a PR have ever run against what it commits. That is
      # how three blog artifacts reached Google as Soft 404s: they were written
      # by this workflow, and the gate that would have caught them only ever
      # ran on pull requests.
      #
      # Order matters. The baseline update runs FIRST and exits non-zero if the
      # refresh produced a NEW empty page, so the job dies before the commit
      # step rather than recording the problem and pushing it. When the refresh
      # FIXES a known-empty page it prunes that row here, in the same commit
      # that fixes it — otherwise the semantic gate's stale-row rule (fatal, by
      # design) would turn every open PR in the repo red the moment a refresh
      # succeeded. A gate that fires on success is a gate people switch off.
      - name: Gate refreshed artifacts
        working-directory: apps/nickstire
        run: |
          node scripts/update-thin-prerender-baseline.mjs
          pnpm run prerender:check
          pnpm run prerender:semantic-check

      - name: Commit refreshed prerender
        env:
          # 2026-09-10 · THIS USED TO BE THE LITERAL `main`, ON EVERY LINE BELOW.
          # `workflow_dispatch` accepts a --ref and actions/checkout honours it, so
          # a dispatch on a feature branch RENDERED THAT BRANCH'S ROUTES AND WROTE
          # THEM TO MAIN — the ref chose the code and had no say over the
          # destination. Witnessed the same day, dispatching on
          # nickstire/fail-open-source-slices: the run reported success, pushed
          # 09f50e6a7..ca0636927 to main, and put three /careers/<slug> JobPosting
          # leaf pages there while main's shared/routes.ts declared no such routes
          # and its SPA had no JobPage component. prerender-middleware.ts resolves
          # by FILE EXISTENCE alone (no routes-manifest check), so Googlebot would
          # have been served a 200 job posting at a URL where a human got the SPA's
          # not-found — a crawler/user divergence on exactly the Google Jobs pages
          # this repo had just finished fixing.
          #
          # github.ref_name is `main` for the Monday cron and the dispatched branch
          # otherwise, so artifacts now land on the branch whose code produced them.
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 2026-07-09 · `git diff --quiet` only sees TRACKED paths — after
          # PR #615 accidentally deleted the whole prerendered/ tree, every
          # regenerated file was untracked, the diff was quiet, and this
          # step concluded "unchanged" while production served the SPA
          # shell to crawlers. `git status --porcelain` sees untracked too.
          # The baseline is part of the snapshot now: the gate step above prunes
          # a row when the refresh fixes that page, and the pruned ledger has to
          # travel in the SAME commit as the fixed artifact. Left behind, it is a
          # stale row — which check-prerender-semantic.mjs fails on deliberately,
          # so the next PR anyone opens goes red for a refresh that worked.
          if [ -z "$(git status --porcelain -- apps/nickstire/prerendered apps/nickstire/config/thin-prerender-baseline.json)" ]; then
            echo "prerendered/ unchanged — nothing to commit."
          else
            git add apps/nickstire/prerendered apps/nickstire/config/thin-prerender-baseline.json
            git commit -m "chore: weekly prerender refresh [skip ci]"
            # 2026-09-08 · three of that day's five refreshes died right here with
            # "! [rejected] main -> main (fetch first)": a sibling PR merged during
            # the ~20-minute render and a plain push has no idea. The snapshot
            # commit touches only apps/nickstire/prerendered/, so replaying it on
            # the fresh tip is conflict-free unless ANOTHER refresh landed — then
            # the cherry-pick fails and the run says so instead of pushing over it.
            # cherry-pick (not rebase) because the checkout is shallow: it needs
            # only this commit's parent, which the clone has. Three attempts cover
            # a merge that lands between the fetch and the push.
            SNAPSHOT="$(git rev-parse HEAD)"
            echo "target branch: $TARGET_BRANCH (the ref this run's code came from)"
            for attempt in 1 2 3; do
              git fetch origin "$TARGET_BRANCH"
              git checkout --detach "origin/$TARGET_BRANCH"
              if ! git cherry-pick "$SNAPSHOT"; then
                git cherry-pick --abort || true
                echo "::error::another refresh changed prerendered/ since this run started; not pushing over it"
                exit 1
              fi
              if git push origin "HEAD:$TARGET_BRANCH"; then
                echo "pushed on attempt $attempt to $TARGET_BRANCH"
                exit 0
              fi
              echo "push rejected on attempt $attempt — $TARGET_BRANCH moved again; retrying"
              sleep 20
            done
            echo "::error::push failed after 3 attempts"
            exit 1
          fi
