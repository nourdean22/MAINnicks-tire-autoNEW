name: Agent policy

# Guards the agent control plane: instruction-adapter parity + policy canaries.
#
# Deliberately self-contained — Node only, no pnpm install, no turbo. It runs on
# EVERY PR (a stale-instruction fix can land anywhere) and finishes in about two minutes.
# New checks are added by dropping a scripts/agent-os/*.test.mjs file; verify.mjs
# discovers them, so this workflow file does not need editing. That matters here:
# editing .github/workflows/** flips test.yml's path filter into a full turbo
# sweep (~50 min). See docs/agent-os/README.md.
#
# 2026-10-16 · CI diet. This ONE job now also carries the three small PR-only checks that were
# separate workflows or jobs (Completion Authority, Secret Scanning, source citation). GitHub bills
# every job as a whole minute, so four 25-to-110 second jobs billed ~5 minutes a PR push; as steps
# of one job they bill ~3. Every step kept its name and its command. The PR-only steps run BEFORE
# the verify step (which has its own step timeout) and each carries `!cancelled()`, so one red step never
# hides another red step the way separate jobs never did, and a hung verifier cannot cancel them. scripts/agent-os/workflowCostGuards.test.mjs asserts every step
# below still exists, in exactly one job, and that the staged ruleset names this job.
#
# NOTE: this repo has no branch protection, so a red run does not mechanically
# block `gh pr merge`. Red means stop, by convention.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # Session Authority canaries read PR state (list/get) via the GitHub API;
    # an explicit `permissions:` block implicitly sets every OTHER scope to none,
    # so contents:read alone 403'd GET /pulls with "Resource not accessible by
    # integration" -- caught from the real CI log, not anticipated up front.
  # for any future non --skip-ci-check invocation of the review gate that queries statusCheckRollup
  checks: read

concurrency:
  # PR runs share one group per PR (a new push supersedes the old verdict). A push to main gets a
  # group of its own per commit and is never cancelled: that run is the only verdict the commit
  # will get, and one shared group lets GitHub evict the pending run when a third push arrives
  # (same fix as test.yml and e2e-statenour.yml; this file used to cancel main runs).
  group: agent-policy-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'push' && github.sha || 'run' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  policy:
    # The staged ruleset (config/agent-os/ruleset-required-checks.json) names this job as
    # "Agent policy / <name>". Rename both together; workflowCostGuards.test.mjs fails if they drift.
    name: parity, canaries, authority, secrets, citation
    runs-on: ubuntu-latest
    timeout-minutes: 15 # larger than the verify step's own 8; the step timeout is the one that bites first
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # live-gate diffs against the base commit, from git, not the API

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      # 2026-09-23 · API budget. The LIVE full-sweep canary costs ~657 GitHub requests
      # per run (measured: 158 branches); GITHUB_TOKEN gets ~1,000/hour per repo, so
      # two runs an hour 403'd every PR's CI. Live canaries now run only when the diff
      # touches their own code (import closure), on workflow_dispatch, or when forced
      # with AGENT_OS_LIVE_SWEEP=1 / AGENT_OS_LIVE_RESCUE=1 / AGENT_OS_LIVE_GHCLIENT=1 — see
      # scripts/agent-os/live-gate.mjs. The diff comes from git: a PR is checked out as
      # its merge commit, whose first parent is the base; a push diffs against
      # `before`. This step FAILS if that diff can't be computed rather than letting
      # the tests fall back to a live run.
      - name: decide live canaries (git diff, no API)
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) BASE=$(git rev-parse HEAD^1) ;;
            push) BASE="$EVENT_BEFORE" ;;
            *) BASE=$(git rev-parse HEAD) ;;
          esac
          node scripts/agent-os/live-gate.mjs --base "$BASE" >> "$GITHUB_ENV"

      # ─── Completion Authority (was .github/workflows/completion-authority.yml) ───
      # The machine that makes it impossible to call incomplete work complete:
      # - capability ledger states only advance with evidence (validator)
      # - completion requirements are DERIVED from the diff (DoD compiler) and
      #   must carry evidence refs or explicit deferrals — never silence.
      # The review gate reads PR threads/reviews via GraphQL — the default
      # restricted workflow token gets FORBIDDEN without an explicit pull-requests:read
      # (first live PR-event run of the gate, #828).
      - name: Validate capability ledger (evidence-gated states)
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        run: node apps/nickstire/scripts/check-capability-ledger.mjs

      - name: Reality ledger is in sync with the JSON
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        run: |
          node apps/nickstire/scripts/render-reality-ledger.mjs
          git diff --exit-code apps/nickstire/docs/operations/REALITY-LEDGER.md || {
            echo "::error::REALITY-LEDGER.md is stale — run scripts/render-reality-ledger.mjs and commit the result"
            exit 1
          }

      - name: DoD compiler (requirements derived from the diff)
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        run: node apps/nickstire/scripts/dod-compiler.mjs --base "origin/${{ github.base_ref }}" --enforce

      - name: Review gate (unresolved P0/P1/P2 threads, stale approvals, changes-requested)
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node apps/nickstire/scripts/check-review-gate.mjs ${{ github.event.pull_request.number }} --enforce --skip-ci-check

      - name: Contradiction detector (claims vs evidence vs ledger vs PR body)
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > /tmp/pr-body.txt
          node apps/nickstire/scripts/detect-contradictions.mjs --pr-body-file /tmp/pr-body.txt --enforce

      # ─── Secret scanning (was .github/workflows/secret-scan.yml) ───
      # HARD gate: fail a PR if it introduces a NEW secret. Deterministic by design —
      # we scan ONLY the PR's own commit range (base..head), never full history, so the
      # known archived leaks already on main (the old vars.json env dump, the archived
      # check-gateway creds) can't false-positive and block every PR. gitleaks' own
      # `--exit-code 1` guarantees the catch: any secret in the scanned range fails the job.
      - name: Install gitleaks
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        run: |
          set -euo pipefail
          VER=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan the PR's new commits for secrets (hard gate)
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          echo "Scanning ${BASE_SHA}..${HEAD_SHA} (this PR's commits only)"
          # --report-path is what makes a failure actionable. Without it the
          # step prints only 'leaks found: 1' and exits — no rule, no file, no
          # line — so the first thing anyone does on a red gate is GUESS which
          # secret it meant. (2026-08-15: a session guessed wrong, shipped an
          # allowlist for the wrong pattern, and the gate stayed red.) The
          # report is written WITH --redact, so the value is masked and the
          # findings are safe to print in a public log.
          gitleaks git . \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --report-format json \
            --report-path "$RUNNER_TEMP/gitleaks-report.json" \
            --exit-code 1 || {
              echo '--- findings (secret values redacted) ---'
              cat "$RUNNER_TEMP/gitleaks-report.json" || echo '(no report written)'
              exit 1
            }

      # ─── Source citation, charter rule 7 (was the `source citation (rule 7)` job) ───
      # A PR that CHANGES A DEPENDENCY must cite a current source (url + date) in its
      # body. Training data is a fact about the past, so an uncited version bump is a
      # memory claim wearing a fact's clothes.
      #
      # This needs the PR event because it is the one check that cannot run from the
      # tree alone — the PR BODY is only available from the event payload, so
      # verify.mjs's drop-in-a-test-file discovery cannot reach it. The pure logic
      # IS canaried through that path (sourceCitation.test.mjs, 12 arms incl. the
      # #1972 and #1974 false positives); these steps are what make it bite.
      #
      # SCOPE, stated so nobody reads it as broader than it is: dependency edits
      # only. "Switched an approach" and "assumed a platform still behaves this
      # way" leave no syntactic trace and stay on review.
      - name: collect PR diff and body
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        env:
          # Via env, never interpolated into the script body — a PR title or
          # body is attacker-controlled text and must not reach the shell.
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          git diff "origin/$BASE_REF...HEAD" > /tmp/pr.diff
          printf '%s' "$PR_BODY" > /tmp/pr-body.txt
          wc -l /tmp/pr.diff /tmp/pr-body.txt

      - name: check source citation
        if: ${{ github.event_name == 'pull_request' && !cancelled() }}
        run: node scripts/agent-os/check-source-citation.mjs --diff /tmp/pr.diff --body /tmp/pr-body.txt

      # ─── the verifier runs LAST (2026-10-16, Codex review of #3083) ───
      # The cheap PR gates above run first, so a verifier that hangs to its step timeout cannot cancel them.
      - name: agent-os verify
        # A STEP timeout fails this step and lets the job go on; the old job-level 10 minutes cancelled the whole
        # job, so a hung verifier took the three gates above with it however `!cancelled()` was written.
        timeout-minutes: 8
        env:
          # Session Authority canaries (2026-09-23) make read-only GitHub API calls
          # (branch/PR reads, compare) via scripts/agent-os/github-client.mjs and
          # skip themselves when no token is available -- but this job's own
          # checkout provides none by default, so they skipped everywhere until
          # this line. No write-scoped call exists in any of them (verified:
          # repo-rescue.test.mjs's real-PR path is dry-run only).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/agent-os/verify.mjs
