# Dedicated contract gate for StateNour's Python local-agent subsystem.
# Narrow by path so ordinary web changes do not pay this cost.
name: statenour · local agent

on:
  pull_request:
    paths:
      - 'apps/statenour/local-agent/**'
      - '.github/workflows/statenour-local-agent.yml'
  push:
    branches: [main]
    paths:
      - 'apps/statenour/local-agent/**'
      - '.github/workflows/statenour-local-agent.yml'

concurrency:
  group: statenour-local-agent-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create isolated Python environment
        working-directory: apps/statenour/local-agent
        run: |
          python3 --version
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --quiet             'requests>=2.31.0' 'python-dotenv>=1.0.0' 'websockets>=12.0'

      - name: Syntax-check local-agent modules
        working-directory: apps/statenour/local-agent
        run: |
          .venv/bin/python -m py_compile agent.py eufy_agent.py eufy_bridge.py

      - name: Run local-agent contract tests
        working-directory: apps/statenour/local-agent
        run: .venv/bin/python -m unittest discover -v -p 'test_*.py'
