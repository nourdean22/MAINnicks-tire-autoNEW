name: Admin completion diagnostic

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/nickstire-admin-completion-wave-4

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture Nick's Tire typecheck
        shell: bash
        run: |
          set +e
          pnpm --filter nicks-tire-auto run typecheck:raw > admin-completion-diagnostic.log 2>&1
          status=$?
          echo "exit_code=$status" >> admin-completion-diagnostic.log
          exit 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: admin-completion-diagnostic
          path: admin-completion-diagnostic.log
          if-no-files-found: error
