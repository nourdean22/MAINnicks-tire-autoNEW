name: Admin completion diagnostic

# 2026-10-16 · CI diet. This ran a full workspace install plus the nickstire typecheck on EVERY PR push
# (~2 billed minutes, 30 of 30 PR runs in the last 12 hours) and could not fail on a code defect: the
# capture step ends in `exit 0` by design and the only failing path is "no log file was written". The real
# typecheck gate is `check` in test.yml's turbo sweep. No code reads the uploaded artifact (the only
# mentions are dated merge receipts in docs). So it is now on demand: Actions, "Admin completion
# diagnostic", Run workflow; the old wave-4 branch push trigger is kept as it was.
on:
  workflow_dispatch:
  push:
    branches:
      - agent/nickstire-admin-completion-wave-4

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture Nick's Tire typecheck
        shell: bash
        run: |
          set +e
          pnpm --filter nicks-tire-auto run typecheck:raw > admin-completion-diagnostic.log 2>&1
          status=$?
          echo "exit_code=$status" >> admin-completion-diagnostic.log
          exit 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: admin-completion-diagnostic
          path: admin-completion-diagnostic.log
          if-no-files-found: error
