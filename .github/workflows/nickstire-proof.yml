# nickstire · proof engine canaries (Dream-to-Proof wave, 2026-09-15)
#
# The deterministic half of the Proof Engine, run against the LIVE site:
#   · playwright — Tier-1 critical pages (a11y invariants + Argos screenshots)
#                  and the Experience Gym episodes (tests/episodes/*.json)
#   · sitespeed  — Core Web Vitals + HAR + filmstrip for the same pages,
#                  judged against sitespeed/budget.json
#
# Post-deploy and daily, NOT a PR gate: nickstire has no hermetic server
# (prod TiDB only), so a PR cannot be judged before it deploys. Red here is a
# regression on the real storefront and pages the operator via the evidence
# ledger (episode failures + the run summary POST to statenour when a ledger
# key is set).
#
# Secrets (all OPTIONAL — the job degrades to artifacts without them):
#   ARGOS_TOKEN          screenshot diffs reviewed at argos-ci.com
#   STATENOUR_SYNC_URL   e.g. https://bdnick.info — where evidence is POSTed
#   EVIDENCE_LEDGER_KEY  the SCOPED key statenour's /api/sync/evidence accepts and
#                        nothing else does — the right credential for CI.
#   STATENOUR_SYNC_KEY   fallback only: the whole cross-app bridge key. Accepted by
#                        the evidence door too, but it opens /api/sync/*, nour-os,
#                        devices and cron/mega as well. Remove it from this repo's
#                        secrets once EVIDENCE_LEDGER_KEY is set.
#   HOLDOUT_EPISODES_B64 the hidden holdout: base64 of a JSON array of HO-xxx
#                        episodes (tests/episodes/schema.ts shape). Never in the
#                        tree. Absent = the ledger records the holdout as unmeasured.
#
# No branch protection exists in this repo: red is a stop by convention.

name: nickstire · proof

on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC daily · 05:00 ET, before the shop opens
  push:
    branches: [main]
    paths:
      - "apps/nickstire/**"
      - ".github/workflows/nickstire-proof.yml"
  # 2026-10-16 · admin UI v1 Wave 0b. Tick capture_admin_v1_baselines to skip the
  # live canaries and instead render Today, Lot and Approvals from the DEMO
  # fixtures (apps/nickstire/tests/e2e/admin-v1-*.spec.ts) against a static build
  # of `ref`, uploading the six PNGs as the `admin-v1-baselines` artifact. The
  # harness comes from the dispatched commit; only the admin being frozen comes
  # from `ref`, so a pre-W1 SHA can be captured after W1 has merged. Like every
  # workflow_dispatch input, this exists only once the file is on main.
  workflow_dispatch:
    inputs:
      capture_admin_v1_baselines:
        description: "Capture the admin v1 six-feet baselines (skips the live canaries)"
        type: boolean
        default: false
      ref:
        description: "Commit, tag or branch whose admin is frozen as the baseline"
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: nickstire-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  playwright:
    name: critical pages + episodes
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.capture_admin_v1_baselines) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: install (frozen)
        run: pnpm install --frozen-lockfile --filter "nicks-tire-auto..."

      - name: install chromium
        run: pnpm --filter nicks-tire-auto exec playwright install --with-deps chromium

      # A push fires this workflow the moment main moves, minutes before Railway has
      # built and swapped the container (main run 34975001748 judged the PREVIOUS
      # deploy and got a 404 from a statenour route that was still deploying). Wait,
      # bounded, for /api/health to report this commit; on a statenour-only or
      # worker-only push nickstire is never redeployed, so a miss is a warning, not a
      # failure — and LIVE_COMMIT records what was actually judged either way.
      - name: wait for nickstire.org to serve this commit
        if: ${{ github.event_name == 'push' }}
        env:
          WANT: ${{ github.sha }}
        run: |
          # Bounded by wall-clock (10 min), not by attempts: a stalled /api/health
          # would otherwise cost 15 s of curl + 20 s of sleep per attempt (~17 min).
          deadline=$(( $(date +%s) + 600 ))
          while :; do
            live=$(curl -sS --max-time 15 https://nickstire.org/api/health | jq -r '.deploy.commit // ""' 2>/dev/null || echo "")
            if [ "$live" = "$WANT" ]; then echo "live: $live"; break; fi
            now=$(date +%s)
            if [ "$now" -ge "$deadline" ]; then break; fi
            echo "live=${live:-?} want=$WANT — waiting ($(( deadline - now ))s left)"
            sleep $(( deadline - now < 20 ? deadline - now : 20 ))
          done
          [ "$live" = "$WANT" ] || echo "::warning::nickstire.org still serves ${live:-?}, not $WANT, after 10 min — judging what is live"

      - name: record the live commit
        run: |
          live=$(curl -sS --max-time 15 https://nickstire.org/api/health | jq -r '.deploy.commit // ""' 2>/dev/null || echo "")
          echo "LIVE_COMMIT=$live" >> "$GITHUB_ENV"
          echo "judging live commit: ${live:-unknown}"

      - name: run
        id: pw
        continue-on-error: true
        env:
          E2E_BASE_URL: https://nickstire.org
        run: pnpm --filter nicks-tire-auto exec playwright test

      # Hidden holdout (2026-09-15): episodes the optimising agent never sees.
      # HOLDOUT_EPISODES_B64 is a base64 JSON array of HO-xxx episodes (never in
      # the tree; the operator keeps the plain copy outside every checkout). It is
      # unpacked into the runner's temp dir and replayed with id-only titles;
      # the report, traces, screenshots and the run's own stdout all stay under
      # $RUNNER_TEMP, and only ids + counts reach the ledger as `proof.holdout`.
      # Without the secret the ledger records the holdout as UNMEASURED — an
      # absent holdout must never read as a passing one. A read collaborator
      # (the Night Shift identity) cannot read secrets, and nothing below is
      # uploaded as an artifact.
      - name: unpack the hidden holdout
        id: holdout_unpack
        if: ${{ always() && env.HOLDOUT_EPISODES_B64 != '' }}
        env:
          HOLDOUT_EPISODES_B64: ${{ secrets.HOLDOUT_EPISODES_B64 }}
          HOLDOUT_OUT_DIR: ${{ runner.temp }}/holdout/episodes
        run: node apps/nickstire/scripts/proof/unpack-holdout.mjs

      - name: run the hidden holdout
        id: holdout
        if: ${{ always() && steps.holdout_unpack.outputs.count != '' && steps.holdout_unpack.outputs.count != '0' }}
        continue-on-error: true
        env:
          E2E_BASE_URL: https://nickstire.org
          EPISODES_DIR: ${{ runner.temp }}/holdout/episodes
          EPISODES_HOLDOUT: "1"
          EPISODES_RESULTS_DIR: ${{ runner.temp }}/holdout/results/episodes
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/holdout/results.json
        run: |
          mkdir -p "$RUNNER_TEMP/holdout"
          set +e
          pnpm --filter nicks-tire-auto exec playwright test tests/e2e/episodes.spec.ts \
            --reporter=dot,json --output "$RUNNER_TEMP/holdout/output" > "$RUNNER_TEMP/holdout/run.log" 2>&1
          status=$?
          set -e
          # Counts only. The log names the oracles and stays on the runner.
          echo "holdout: playwright exit $status; report $( [ -s "$RUNNER_TEMP/holdout/results.json" ] && echo written || echo MISSING )"
          exit $status

      - name: upload screenshots to Argos
        if: ${{ env.ARGOS_TOKEN != '' }}
        env:
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}
        # The Argos CLI is used via dlx, pinned; no SDK dependency is added to the app.
        run: pnpm dlx @argos-ci/cli@6.9.4 upload apps/nickstire/test-results/argos --token "$ARGOS_TOKEN" --build-name nickstire-critical-pages

      - name: post episode results to the evidence ledger
        # Either key opens the evidence door; the scoped one is the right one for CI.
        # `env.*` here reads THIS step's env (proven: this step ran on main run
        # 34975001748). `secrets.*` is NOT a valid context in a step `if` — using it
        # made the whole workflow file invalid (run 34978069055, zero jobs).
        if: ${{ always() && (env.EVIDENCE_LEDGER_KEY != '' || env.STATENOUR_SYNC_KEY != '') }}
        env:
          STATENOUR_SYNC_URL: ${{ secrets.STATENOUR_SYNC_URL }}
          EVIDENCE_LEDGER_KEY: ${{ secrets.EVIDENCE_LEDGER_KEY }}
          STATENOUR_SYNC_KEY: ${{ secrets.STATENOUR_SYNC_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTCOME: ${{ steps.pw.outcome }}
          WANT_COMMIT: ${{ github.sha }}
          # LIVE_COMMIT comes from "record the live commit" via GITHUB_ENV
          # Hidden holdout: the report path (runner-local), the step outcome
          # ('' / skipped when there was no secret) and the unpacked count.
          HOLDOUT_RESULTS: ${{ runner.temp }}/holdout/results.json
          HOLDOUT_OUTCOME: ${{ steps.holdout.outcome }}
          HOLDOUT_UNPACKED: ${{ steps.holdout_unpack.outputs.count }}
        run: node apps/nickstire/scripts/proof/post-run-evidence.mjs

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: playwright-results
          path: |
            apps/nickstire/test-results
            apps/nickstire/playwright-report
          retention-days: 14

      - name: fail the job if the suite or the hidden holdout failed
        if: ${{ steps.pw.outcome == 'failure' || steps.holdout.outcome == 'failure' }}
        run: exit 1

  sitespeed:
    name: core web vitals (desktop canary)
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.capture_admin_v1_baselines) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: wait for nickstire.org to serve this commit
        if: ${{ github.event_name == 'push' }}
        env:
          WANT: ${{ github.sha }}
        run: |
          # Same wall-clock bound as the playwright job (10 min, no sleep past it).
          deadline=$(( $(date +%s) + 600 ))
          while :; do
            live=$(curl -sS --max-time 15 https://nickstire.org/api/health | jq -r '.deploy.commit // ""' 2>/dev/null || echo "")
            if [ "$live" = "$WANT" ]; then echo "live: $live"; break; fi
            now=$(date +%s)
            if [ "$now" -ge "$deadline" ]; then break; fi
            echo "live=${live:-?} want=$WANT — waiting ($(( deadline - now ))s left)"
            sleep $(( deadline - now < 20 ? deadline - now : 20 ))
          done
          [ "$live" = "$WANT" ] || echo "::warning::nickstire.org still serves ${live:-?}, not $WANT, after 10 min — measuring what is live"

      - name: sitespeed.io against the live Tier-1 pages
        # Pinned image tag — bump deliberately, cite the release in the PR body.
        # Desktop Chrome on purpose: the real-device mobile lane is sitespeed/android-canary.sh,
        # which compares against THIS run. Budget keys must be sitespeed friendly names — an
        # unknown key crashes the budget plugin (run 34975001748: `ttfb` → TypeError), it is
        # not skipped.
        run: |
          mkdir -p apps/nickstire/test-results/sitespeed-desktop
          docker run --rm \
            -v "$PWD/apps/nickstire/test-results/sitespeed-desktop:/sitespeed.io" \
            -v "$PWD/apps/nickstire/sitespeed:/config:ro" \
            sitespeedio/sitespeed.io:42.7.0 \
            --browser chrome -n 3 \
            --budget.configPath /config/budget.json \
            --outputFolder /sitespeed.io \
            /config/urls.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: sitespeed-desktop
          path: apps/nickstire/test-results/sitespeed-desktop
          retention-days: 14

  # Dispatch-only (capture_admin_v1_baselines). Nothing here reaches nickstire.org,
  # a database or a secret: the specs serve the static build through page.route on
  # a fake .test origin and abort every other host.
  admin-v1-capture:
    name: admin v1 baselines (capture)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.capture_admin_v1_baselines }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The harness: fixtures, router and specs from the dispatched commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The admin being frozen, from `ref`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          path: admin-ref

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: install harness (frozen)
        run: pnpm install --frozen-lockfile --filter "nicks-tire-auto..."

      - name: install ref (frozen)
        working-directory: admin-ref
        run: pnpm install --frozen-lockfile --filter "nicks-tire-auto..."

      - name: build the ref's SPA (vite only, no server, no prerender)
        working-directory: admin-ref/apps/nickstire
        run: |
          pnpm exec vite build
          git -C "$GITHUB_WORKSPACE/admin-ref" rev-parse HEAD | tee "$RUNNER_TEMP/admin-v1-ref.txt"

      - name: install chromium
        run: pnpm --filter nicks-tire-auto exec playwright install --with-deps chromium

      # The fixture spec first: a render with an unstubbed procedure or a
      # first-party error must not become a baseline.
      - name: fixture render (390 and 1440)
        working-directory: apps/nickstire
        env:
          CI: "true"
          ADMIN_V1_DIST: ${{ github.workspace }}/admin-ref/apps/nickstire/dist/public
        run: pnpm exec playwright test tests/e2e/admin-v1-fixtures.spec.ts --project=iphone-14 --project=desktop --workers=1

      - name: capture baselines
        working-directory: apps/nickstire
        env:
          CI: "true"
          ADMIN_V1_DIST: ${{ github.workspace }}/admin-ref/apps/nickstire/dist/public
          ADMIN_V1_GATE: "1"
          ADMIN_V1_CAPTURE: "1"
        run: pnpm exec playwright test tests/e2e/admin-v1-gate.spec.ts --project=iphone-14 --project=desktop --workers=1

      # Exactly these six files, or fail: a dropped page or viewport must not
      # upload as a complete set. The ref SHA travels with the PNGs.
      - name: check baselines are complete
        working-directory: apps/nickstire/tests/e2e/admin-v1-baselines
        run: |
          for f in overview-390 overview-1440 lot-390 lot-1440 approvals-390 approvals-1440; do
            test -f "$f.png" || { echo "missing baseline: $f.png"; exit 1; }
          done
          cp "$RUNNER_TEMP/admin-v1-ref.txt" SOURCE_REF.txt
          ls -l

      - name: upload admin v1 baselines
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: admin-v1-baselines
          path: apps/nickstire/tests/e2e/admin-v1-baselines/
          if-no-files-found: error
          retention-days: 14
