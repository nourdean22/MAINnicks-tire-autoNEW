name: CI · turbo-affected verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      statenour: ${{ steps.filter.outputs.statenour }}
      nickstire: ${{ steps.filter.outputs.nickstire }}
      worker: ${{ steps.filter.outputs.worker }}
      voice: ${{ steps.filter.outputs.voice }}
      packages: ${{ steps.filter.outputs.packages }}
      node: ${{ steps.filter.outputs.node }}
      workflow: ${{ steps.filter.outputs.workflow }}
      infra: ${{ steps.filter.outputs.infra }}
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - name: Checkout (full history for affected-detection)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            nickstire:
              - 'apps/nickstire/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.github/workflows/**'
            statenour:
              - 'apps/statenour/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.github/workflows/**'
            worker:
              - 'apps/worker/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.github/workflows/**'
            voice:
              - 'apps/voice/**'
              - '.github/workflows/**'
            packages:
              - 'packages/**'
            node:
              - 'apps/nickstire/**'
              - 'apps/statenour/**'
              - 'apps/worker/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.github/workflows/**'
            workflow:
              - '.github/workflows/**'
            infra:
              - 'docs/RAILWAY_PROVISION.md'
              - 'apps/*/DEPLOY.md'
              - 'railway.json'
              - 'railway.toml'
              - 'nixpacks.toml'
              - 'Procfile'
            docs_only:
              - '**/*.md'
              - 'docs/**'

  node:
    needs: changes
    if: ${{ needs.changes.outputs.node == 'true' || needs.changes.outputs.workflow == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # 2026-07-15 · @statenour/web tsc --noEmit outgrew Node's ~2GB default
      # old-space: deterministic OOM (exit 134) on runs 29408774484 and
      # 29409229006, killing the pipeline before tests. Runners have 16GB;
      # verified locally: the same check passes with this heap in ~44s.
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Checkout (full history for affected-detection)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 20 (matches Railway runtime)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      # Turbo `--affected` diffs against the local `main` branch, which a
      # detached-HEAD PR checkout does not have — it only has `origin/main`.
      # Without this, turbo logged "Failed to resolve base ref 'main'" and
      # silently fell back to running EVERYTHING (which then tripped on
      # unrelated packages). Create the local ref so affected-detection is
      # real. Skipped on main itself (already the current ref).
      - name: Ensure base ref 'main' for Turbo --affected
        if: github.ref_name != 'main'
        run: git fetch --no-tags origin main:main

      # ─── Affected pipeline (Turbo handles parallelism + cache) ────────
      - name: Verify affected (check + lint + test + build)
        run: pnpm exec turbo run check lint test build --affected --output-logs=errors-only
        env:
          TURBO_LOG_VERBOSITY: 0
          NODE_ENV: test
          CI: true
          BUILD_COMMIT: ${{ github.sha }}
          BUILD_BRANCH: ${{ github.ref_name }}

      # ─── Nickstire-only custom validators ──
      - name: Nickstire · env validate
        if: ${{ needs.changes.outputs.nickstire == 'true' || needs.changes.outputs.workflow == 'true' }}
        run: pnpm --filter nicks-tire-auto env:validate

      - name: Nickstire · source lint (console.* in server, etc)
        if: ${{ needs.changes.outputs.nickstire == 'true' || needs.changes.outputs.workflow == 'true' }}
        run: pnpm --filter nicks-tire-auto lint:source

      - name: Nickstire · hook lint
        if: ${{ needs.changes.outputs.nickstire == 'true' || needs.changes.outputs.workflow == 'true' }}
        run: pnpm --filter nicks-tire-auto lint:hooks

      - name: Nickstire · brand-voice lint
        if: ${{ needs.changes.outputs.nickstire == 'true' || needs.changes.outputs.workflow == 'true' }}
        run: pnpm --filter nicks-tire-auto lint:brand-voice

      - name: Nickstire · pii lint
        if: ${{ needs.changes.outputs.nickstire == 'true' || needs.changes.outputs.workflow == 'true' }}
        run: pnpm --filter nicks-tire-auto lint:pii

      - name: Nickstire · route registry validation
        if: ${{ needs.changes.outputs.nickstire == 'true' || needs.changes.outputs.workflow == 'true' }}
        run: pnpm --filter nicks-tire-auto validate:routes

      - name: Nickstire · prerender check
        if: ${{ needs.changes.outputs.nickstire == 'true' || needs.changes.outputs.workflow == 'true' }}
        run: pnpm --filter nicks-tire-auto prerender:check

      # ─── Statenour-only custom validators ───
      # Workflow-only diffs flip these validators ON while `turbo --affected`
      # builds nothing, so prompt:size-check crashed importing the unbuilt
      # @nour/ai-capabilities dist (runs 29362837192 / 29364485363). Build the
      # statenour workspace deps explicitly — turbo cache makes this ~free
      # whenever --affected already built them.
      - name: Statenour · build workspace deps (validators import dists)
        if: ${{ needs.changes.outputs.statenour == 'true' || needs.changes.outputs.workflow == 'true' }}
        run: pnpm exec turbo run build --filter="@statenour/web^..." --output-logs=errors-only

      - name: Statenour · raw-sql check
        if: ${{ needs.changes.outputs.statenour == 'true' || needs.changes.outputs.workflow == 'true' }}
        run: pnpm --filter @statenour/web check:raw-sql

      - name: Statenour · crons check
        if: ${{ needs.changes.outputs.statenour == 'true' || needs.changes.outputs.workflow == 'true' }}
        run: pnpm --filter @statenour/web check:crons

      - name: Statenour · stale-doc guard (strict)
        if: ${{ needs.changes.outputs.statenour == 'true' || needs.changes.outputs.workflow == 'true' }}
        run: pnpm --filter @statenour/web check:stale-docs
        env:
          STALE_DOCS_STRICT: '1'

      # ─── REMOVED: Statenour · prompt size-check ──────────────────────
      # `pnpm --filter @statenour/web prompt:size-check` ran here and was the
      # single reason this job was red on every statenour/workflow PR.
      #
      # measure-prompt-size.ts boots the real prompt graph, which needs a live
      # database. CI has no DATABASE_URL, so Prisma failed instantly --
      #   "No database host or connection string was set ... (host: localhost,
      #    user: runner, db: runner)"
      # -- the errors were swallowed, and the process then HUNG until the job's
      # 25-minute timeout killed it. Measured on run 29500176167: the step
      # burned 1431s of a 1500s budget and never printed one scenario line.
      # Everything after it -- prisma validate AND both dependency-audit steps
      # -- was skipped, so the security gate never actually executed.
      #
      # Handing CI a database would not fix it either: prompt size depends on
      # real brain/task content, so against an empty CI database it measures a
      # stub and passes trivially. It is a manual check by design -- its own
      # header says so ("For now it's a manual check we run after any prompt
      # change"). Run it locally, where the data is:
      #
      #   pnpm --filter @statenour/web prompt:size-check
      #
      # Do not re-add it here without giving it real data AND a step-level
      # timeout-minutes; a hang here silently disables every step below.

      - name: Statenour · prisma validate
        if: ${{ needs.changes.outputs.statenour == 'true' || needs.changes.outputs.workflow == 'true' }}
        run: pnpm --filter @statenour/web exec prisma validate

      # ─── Security audit (high+ · advisory, non-blocking) ─────────────
      # Both steps below used to run `pnpm audit`, which POSTs to npm's legacy
      # audit endpoint. npm RETIRED it — every call now returns 410, so the
      # blocking gate failed on 100% of PRs no matter the content, and a real
      # CVE was indistinguishable from the endpoint being gone. scripts/
      # audit-advisories.mjs keeps the same contract (prod-only, --audit-level,
      # non-zero exit blocks) against the bulk endpoint, which is live.
      # NOTE: dependency-review.yml does NOT backstop this, and cannot. That
      # action needs a PUBLIC repo or private+GitHub Advanced Security; this
      # repo is private and owned by a personal account, and GHAS is an
      # Enterprise-org product. It is continue-on-error, so it reports a
      # decorative green while doing nothing. (dependency-review.yml's own
      # comment claims enabling Dependency Graph makes it start reporting —
      # that is false here.) This step is the repo's only dependency gate.
      - name: Dependency audit (high+ severity · advisory)
        continue-on-error: true
        run: node scripts/audit-advisories.mjs --audit-level=high --advisory

      # ─── Security gate (critical · BLOCKING) ─────────────────────────
      # Exits 2 (fails) if the scanner itself cannot run. That is deliberate:
      # a scan that silently passes when it is broken is how this gate rotted
      # into permanent red that everyone learned to ignore.
      - name: Dependency audit (critical severity · blocking)
        run: node scripts/audit-advisories.mjs --audit-level=critical

  voice:
    needs: changes
    if: ${{ needs.changes.outputs.voice == 'true' || needs.changes.outputs.workflow == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/voice/requirements.txt

      - name: Syntax check
        run: python -m py_compile apps/voice/agent.py

  railway-smoke:
    needs: [changes, node, voice]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.node.result == 'success' || needs.node.result == 'skipped') && (needs.voice.result == 'success' || needs.voice.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for deployments to settle
        run: sleep 30

      - name: Smoke Test (Advisory by default)
        env:
          NICKSTIRE_HEALTH_URL: ${{ vars.NICKSTIRE_HEALTH_URL }}
          STATENOUR_HEALTH_URL: ${{ vars.STATENOUR_HEALTH_URL }}
          WORKER_HEALTH_URL: ${{ vars.WORKER_HEALTH_URL }}
          VOICE_HEALTH_URL: ${{ vars.VOICE_HEALTH_URL }}
          RAILWAY_SMOKE_STRICT: ${{ vars.RAILWAY_SMOKE_STRICT }}
        run: |
          check_url() {
            local name=$1
            local url=$2
            if [[ -n "$url" ]]; then
              echo "Checking $name health at $url..."
              if ! curl -sSf --retry 3 --retry-delay 5 "$url" > /dev/null; then
                echo "::warning::Health check failed for $name at $url"
                if [[ "$RAILWAY_SMOKE_STRICT" == "true" ]]; then
                  echo "Strict mode enabled. Failing job."
                  exit 1
                fi
              else
                echo "Health check passed for $name"
              fi
            else
              echo "Skipping $name: URL not configured in variables."
            fi
          }

          check_url "Nick's Tire" "$NICKSTIRE_HEALTH_URL"
          check_url "Statenour" "$STATENOUR_HEALTH_URL"
          check_url "Worker" "$WORKER_HEALTH_URL"
          check_url "Voice" "$VOICE_HEALTH_URL"

  notify:
    needs: [changes, node, voice, railway-smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate Summary
        run: |
          cat <<EOF >> $GITHUB_STEP_SUMMARY
          ## CI Pipeline Summary
          
          **Changes Detected:**
          - Node/Turbo affected: \`${{ needs.changes.outputs.node }}\`
          - Voice agent affected: \`${{ needs.changes.outputs.voice }}\`
          - Docs only: \`${{ needs.changes.outputs.docs_only }}\`
          
          **Job Results:**
          - Node Job: \`${{ needs.node.result }}\`
          - Voice Job: \`${{ needs.voice.result }}\`
          - Smoke Tests: \`${{ needs.railway-smoke.result }}\`
          EOF

      - name: Notify Slack (Optional)
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [[ -n "${SLACK_WEBHOOK_URL:-}" ]]; then
            status="SUCCESS"
            if [[ "${{ needs.node.result }}" == "failure" || "${{ needs.voice.result }}" == "failure" ]]; then
              status="FAILED"
            fi
            
            message="GitHub Actions CI/CD completed for $GITHUB_REPOSITORY ($GITHUB_REF_NAME).\nStatus: $status"
            curl -s -X POST -H 'Content-type: application/json' \
              --data "{\"text\":\"$message\"}" \
              "$SLACK_WEBHOOK_URL" || true
          fi
          
      - name: Fail on critical upstream failure
        run: |
          if [[ "${{ needs.node.result }}" == "failure" || "${{ needs.node.result }}" == "cancelled" ]]; then
            echo "::error::Node CI job failed or was cancelled."
            exit 1
          fi
          if [[ "${{ needs.voice.result }}" == "failure" || "${{ needs.voice.result }}" == "cancelled" ]]; then
            echo "::error::Voice CI job failed or was cancelled."
            exit 1
          fi
          if [[ "${{ vars.RAILWAY_SMOKE_STRICT }}" == "true" && "${{ needs.railway-smoke.result }}" == "failure" ]]; then
            echo "::error::Strict Smoke Tests failed."
            exit 1
          fi
