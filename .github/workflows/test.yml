name: CI · turbo-affected verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Tier-2-G (2026-05-19): switched from blind verify-everything to
# Turbo's --affected detection. PRs that only touch apps/statenour/
# skip nickstire's check/lint/test/build. PRs that touch packages/utils/
# trigger all downstream consumers automatically via the workspace
# dependency graph. Cached tasks replay logs in <1s.
#
# The Turbo command is the single source of truth · no more drift
# between this file and what runs locally. Pre-push hook runs the
# same `turbo run build --affected`; if it passes there it passes here.

jobs:
  affected:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout (full history for affected-detection)
        uses: actions/checkout@v4
        with:
          # Turbo needs at least the merge-base commit to compute
          # --affected. fetch-depth: 0 grabs everything; for huge repos
          # this could be tightened with `fetch-depth: 100` + a
          # `git fetch origin main` step.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      # Pin to Node 20 to match Railway's Dockerfile runtime
      # (FROM node:20-alpine in apps/statenour/Dockerfile + apps/worker/Dockerfile).
      # Node 22 in CI vs Node 20 in prod was a latent false-green risk · caught by
      # the Tier-2-G code-review pass.
      - name: Setup Node 20 (matches Railway runtime)
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Detect changed paths
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            statenour:
              - 'apps/statenour/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
            nickstire:
              - 'apps/nickstire/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
            worker:
              - 'apps/worker/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
            packages:
              - 'packages/**'

      # ─── Affected pipeline (Turbo handles parallelism + cache) ────────
      - name: Verify affected (check + lint + test + build)
        run: pnpm exec turbo run check lint test build --affected --output-logs=errors-only
        env:
          # Turbo writes cache hits to console with "cache hit, replaying
          # logs" · keep CI logs readable.
          TURBO_LOG_VERBOSITY: 0
          # Carry through env-var hashes so cache keys stay correct
          NODE_ENV: test

      # ─── Nickstire-only custom validators (no Turbo equivalent yet) ──
      - name: Nickstire · env validate
        if: steps.changes.outputs.nickstire == 'true'
        run: pnpm --filter nicks-tire-auto env:validate

      - name: Nickstire · source lint (console.* in server, etc)
        if: steps.changes.outputs.nickstire == 'true'
        run: pnpm --filter nicks-tire-auto lint:source

      - name: Nickstire · route registry validation
        if: steps.changes.outputs.nickstire == 'true'
        run: pnpm --filter nicks-tire-auto validate:routes

      # ─── Statenour-only custom validator (no Turbo equivalent yet) ───
      - name: Statenour · stale-doc guard (strict)
        if: steps.changes.outputs.statenour == 'true'
        run: pnpm --filter @statenour/web check:stale-docs
        env:
          STALE_DOCS_STRICT: '1'

      # ─── Security audit (always runs · cheap + non-blocking) ─────────
      - name: Dependency audit (high+ severity)
        continue-on-error: true
        run: pnpm audit --prod --audit-level=high

      # ─── Summary ──────────────────────────────────────────────────────
      - name: Summary
        if: always()
        run: |
          echo "Affected apps:"
          echo "  statenour:  ${{ steps.changes.outputs.statenour }}"
          echo "  nickstire:  ${{ steps.changes.outputs.nickstire }}"
          echo "  worker:     ${{ steps.changes.outputs.worker }}"
          echo "  (packages): ${{ steps.changes.outputs.packages }}"
