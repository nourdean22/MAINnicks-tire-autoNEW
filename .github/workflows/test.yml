name: CI · turbo-affected verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # 2026-07-28 · sha-keyed on push. cancel-in-progress:false is NOT enough on
  # a shared group: GitHub allows one RUNNING + one PENDING run per group, so
  # a third qualifying push to main evicts the pending one and that commit is
  # never verified. Fixed in e2e-statenour.yml first; this is the same defect
  # in the primary gate (the typecheck/lint/test/build sweep), found by an
  # audit of that fix — a fix applied to one workflow and not its sibling.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      statenour: ${{ steps.filter.outputs.statenour }}
      nickstire: ${{ steps.filter.outputs.nickstire }}
      worker: ${{ steps.filter.outputs.worker }}
      packages: ${{ steps.filter.outputs.packages }}
      node: ${{ steps.filter.outputs.node }}
      workflow: ${{ steps.filter.outputs.workflow }}
      infra: ${{ steps.filter.outputs.infra }}
      docs_only: ${{ steps.filter.outputs.docs_only }}
    steps:
      - name: Checkout (full history for affected-detection)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            nickstire:
              - 'apps/nickstire/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.github/workflows/**'
            statenour:
              - 'apps/statenour/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.github/workflows/**'
            worker:
              - 'apps/worker/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.github/workflows/**'
            packages:
              - 'packages/**'
            node:
              - 'apps/nickstire/**'
              - 'apps/statenour/**'
              - 'apps/worker/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.github/workflows/**'
            workflow:
              - '.github/workflows/**'
            infra:
              - 'docs/RAILWAY_PROVISION.md'
              - 'apps/*/DEPLOY.md'
              - 'railway.json'
              - 'railway.toml'
              - 'nixpacks.toml'
              - 'Procfile'
            docs_only:
              - '**/*.md'
              - 'docs/**'

  node:
    needs: changes
    if: ${{ needs.changes.outputs.node == 'true' || needs.changes.outputs.workflow == 'true' }}
    runs-on: ubuntu-latest
    # 2026-07-26 · 25 was sized for a NARROW affected set (main's last green node
    # job: 8 tasks / 5m35s). A root pnpm-lock.yaml / package.json change makes
    # turbo --affected include EVERY package — 33 tasks, cold cache — and #1090
    # traded the vitest threads pool for the slower forks pool. Both attempts on
    # e59b70dad died mid-"Verify affected" (24.2m and 22.7m+, 27/33 tasks done,
    # ZERO failing tasks): the sweep simply outgrew the budget, so every
    # dependency PR reddened main on the clock rather than on a defect.
    timeout-minutes: 50
    env:
      # 2026-07-15 · @statenour/web tsc --noEmit outgrew Node's ~2GB default
      # old-space: deterministic OOM (exit 134) on runs 29408774484 and
      # 29409229006, killing the pipeline before tests. Runners have 16GB;
      # verified locally: the same check passes with this heap in ~44s.
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Checkout (full history for affected-detection)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 24 (matches Railway runtime)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      # Turbo `--affected` diffs against the local `main` branch, which a
      # detached-HEAD PR checkout does not have — it only has `origin/main`.
      # Without this, turbo logged "Failed to resolve base ref 'main'" and
      # silently fell back to running EVERYTHING (which then tripped on
      # unrelated packages). Create the local ref so affected-detection is
      # real. Skipped on main itself (already the current ref).
      - name: Ensure base ref 'main' for Turbo --affected
        if: github.ref_name != 'main'
        run: git fetch --no-tags origin main:main

      # ─── Affected pipeline (Turbo handles parallelism + cache) ────────
      - name: Verify affected (check + lint + test + build)
        # 2026-07-28 · --concurrency=2 + a memory sampler.
        #
        # SYMPTOM: every dependency PR reddens here. #1092 failed 4/4 with an
        # IDENTICAL signature — "27 successful, 33 total", zero FAILING tasks,
        # the same six heavy tasks (@statenour/web build/check/lint/test +
        # nickstire) force-killed — at wildly different durations (10m, 10m,
        # 13m, 25m). A timeout yields varying progress at a fixed time; this
        # is fixed progress at varying times, which is resource death.
        #
        # MECHANISM (inferred, NOT yet directly observed): turbo defaults to
        # concurrency 10 and the job sets NODE_OPTIONS=--max-old-space-size=6144
        # for every process it spawns. The heavy tasks depend on package builds
        # so they CLUSTER at the tail — several node processes, each permitted
        # 6GB, on a 2-core runner measured at ~6.9GB total (e2e probe, same
        # runner class; the note below claiming 16GB is wrong for this plan).
        # A lockfile change makes --affected include all 33 packages, which is
        # why only dependency PRs hit it.
        #
        # The heap ceiling is deliberately NOT lowered: it was raised to fix a
        # real tsc OOM (exit 134), and a ceiling only PERMITS growth. Bounding
        # how many processes may grow at once is the targeted lever.
        # Tradeoff: less parallelism on a 2-core box costs wall time. The
        # budget is 50m and these runs currently die at 10-25m, so there is
        # room — if this now times out, raise timeout-minutes, do not raise
        # concurrency back.
        #
        # The sampler makes the next run decisive: if `min avail` stays high,
        # memory is refuted and the cause is elsewhere.
        #
        # --concurrency is passed as a FLAG, not TURBO_CONCURRENCY: `turbo run
        # --help` on the pinned version documents the flag and says nothing
        # about that env var. An unread env var would make this fix a silent
        # no-op — the same trap as the duplicated heap flag in e1e28c2f6.
        run: |
          ( while true; do
              free -m | awk '/^Mem:/ {print $7}' >> /tmp/mem-samples.txt
              sleep 5
            done ) &
          SAMPLER=$!
          set +e
          pnpm exec turbo run check lint test build --affected --output-logs=errors-only --concurrency=2
          STATUS=$?
          set -e
          kill $SAMPLER 2>/dev/null || true
          if [ -s /tmp/mem-samples.txt ]; then
            echo "--- runner memory during the sweep ---"
            echo "  samples: $(wc -l < /tmp/mem-samples.txt) · min avail: $(sort -n /tmp/mem-samples.txt | head -1)MB · max avail: $(sort -n /tmp/mem-samples.txt | tail -1)MB"
          fi
          exit $STATUS
        env:
          TURBO_LOG_VERBOSITY: 0
          NODE_ENV: test
          CI: true
          BUILD_COMMIT: ${{ github.sha }}
          BUILD_BRANCH: ${{ github.ref_name }}

      # ─── Nickstire-only custom validators ──
      - name: Nickstire · env validate
        if: ${{ needs.changes.outputs.nickstire == 'true' || needs.changes.outputs.workflow == 'true' }}
        run: pnpm --filter nicks-tire-auto env:validate

      - name: Nickstire · source lint (console.* in server, etc)
        if: ${{ needs.changes.outputs.nickstire == 'true' || needs.changes.outputs.workflow == 'true' }}
        run: pnpm --filter nicks-tire-auto lint:source

      - name: Nickstire · hook lint
        if: ${{ needs.changes.outputs.nickstire == 'true' || needs.changes.outputs.workflow == 'true' }}
        run: pnpm --filter nicks-tire-auto lint:hooks

      - name: Nickstire · brand-voice lint
        if: ${{ needs.changes.outputs.nickstire == 'true' || needs.changes.outputs.workflow == 'true' }}
        run: pnpm --filter nicks-tire-auto lint:brand-voice

      - name: Nickstire · pii lint
        if: ${{ needs.changes.outputs.nickstire == 'true' || needs.changes.outputs.workflow == 'true' }}
        run: pnpm --filter nicks-tire-auto lint:pii

      - name: Nickstire · route registry validation
        if: ${{ needs.changes.outputs.nickstire == 'true' || needs.changes.outputs.workflow == 'true' }}
        run: pnpm --filter nicks-tire-auto validate:routes

      - name: Nickstire · prerender check
        if: ${{ needs.changes.outputs.nickstire == 'true' || needs.changes.outputs.workflow == 'true' }}
        run: pnpm --filter nicks-tire-auto prerender:check

      # ─── Statenour-only custom validators ───
      # Workflow-only diffs flip these validators ON while `turbo --affected`
      # builds nothing, so prompt:size-check crashed importing the unbuilt
      # @nour/ai-capabilities dist (runs 29362837192 / 29364485363). Build the
      # statenour workspace deps explicitly — turbo cache makes this ~free
      # whenever --affected already built them.
      - name: Statenour · build workspace deps (validators import dists)
        if: ${{ needs.changes.outputs.statenour == 'true' || needs.changes.outputs.workflow == 'true' }}
        run: pnpm exec turbo run build --filter="@statenour/web^..." --output-logs=errors-only

      - name: Statenour · raw-sql check
        if: ${{ needs.changes.outputs.statenour == 'true' || needs.changes.outputs.workflow == 'true' }}
        run: pnpm --filter @statenour/web check:raw-sql

      - name: Statenour · crons check
        if: ${{ needs.changes.outputs.statenour == 'true' || needs.changes.outputs.workflow == 'true' }}
        run: pnpm --filter @statenour/web check:crons

      - name: Statenour · stale-doc guard (strict)
        if: ${{ needs.changes.outputs.statenour == 'true' || needs.changes.outputs.workflow == 'true' }}
        run: pnpm --filter @statenour/web check:stale-docs
        env:
          STALE_DOCS_STRICT: '1'

      # ─── REMOVED: Statenour · prompt size-check ──────────────────────
      # `pnpm --filter @statenour/web prompt:size-check` ran here and was the
      # single reason this job was red on every statenour/workflow PR.
      #
      # measure-prompt-size.ts boots the real prompt graph, which needs a live
      # database. CI has no DATABASE_URL, so Prisma failed instantly --
      #   "No database host or connection string was set ... (host: localhost,
      #    user: runner, db: runner)"
      # -- the errors were swallowed, and the process then HUNG until the job's
      # 25-minute timeout killed it. Measured on run 29500176167: the step
      # burned 1431s of a 1500s budget and never printed one scenario line.
      # Everything after it -- prisma validate AND both dependency-audit steps
      # -- was skipped, so the security gate never actually executed.
      #
      # Handing CI a database would not fix it either: prompt size depends on
      # real brain/task content, so against an empty CI database it measures a
      # stub and passes trivially. It is a manual check by design -- its own
      # header says so ("For now it's a manual check we run after any prompt
      # change"). Run it locally, where the data is:
      #
      #   pnpm --filter @statenour/web prompt:size-check
      #
      # Do not re-add it here without giving it real data AND a step-level
      # timeout-minutes; a hang here silently disables every step below.

      # DATABASE_URL is required for this to run at all, but is NEVER connected
      # to: `prisma validate` only parses the schema and resolves env() refs.
      # Without it the step died P1012 ("Environment variable not found:
      # DATABASE_URL" at schema.prisma:8) on every run -- prisma.config.ts
      # makes the CLI log "Prisma config detected, skipping environment
      # variable loading", so its own `process.env.DATABASE_URL || placeholder`
      # fallback never reaches schema.prisma's env("DATABASE_URL").
      # This went unnoticed because the prompt:size-check hang (removed in
      # #762) always killed the job before reaching this step. The value below
      # is the same placeholder prisma.config.ts already defines.
      - name: Statenour · prisma validate
        if: ${{ needs.changes.outputs.statenour == 'true' || needs.changes.outputs.workflow == 'true' }}
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/statenour
        run: pnpm --filter @statenour/web exec prisma validate

  # ─── Dependency gate — deliberately its OWN job ────────────────────
  # These two steps used to be the last steps of `node`. That placement meant
  # ANY unrelated failure above them skipped the gate silently, and in
  # practice it never ran once:
  #   - the prompt:size-check hang (removed in #762) ate the 25-min budget
  #     -> both audit steps "skipped"
  #   - with the hang gone, `prisma validate` failed P1012 on run 29507730752
  #     -> both audit steps "skipped" again
  # A security gate that an unrelated statenour validator can switch off is
  # not a gate. In its own job it runs regardless of what else breaks, and it
  # cannot be disabled by anything except itself.
  #
  # Ungated on `changes` on purpose: advisories are published against
  # dependencies you ALREADY have, so "nothing changed" is not a reason to
  # skip. It costs ~1 min.
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 24 (matches Railway runtime)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      # scripts/audit-advisories.mjs replaced `pnpm audit`, which POSTs to
      # npm's legacy audit endpoint. npm RETIRED it — every call returns 410,
      # so the blocking gate failed on 100% of PRs regardless of content and a
      # real CVE was indistinguishable from the endpoint being gone (#760).
      # NOTE: dependency-review.yml does NOT backstop this, and cannot. That
      # action needs a PUBLIC repo or private+GitHub Advanced Security; this
      # repo is private and owned by a personal account, and GHAS is an
      # Enterprise-org product. It is continue-on-error, so it reports a
      # decorative green while doing nothing. This job is the repo's ONLY
      # dependency gate.
      - name: Dependency audit (high+ severity · advisory)
        continue-on-error: true
        run: node scripts/audit-advisories.mjs --audit-level=high --advisory

      # Exits 2 (fails) if the scanner itself cannot run. That is deliberate:
      # a scan that silently passes when it is broken is how this gate rotted
      # into permanent red that everyone learned to ignore.
      - name: Dependency audit (critical severity · blocking)
        run: node scripts/audit-advisories.mjs --audit-level=critical


  railway-smoke:
    needs: [changes, node]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.node.result == 'success' || needs.node.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for deployments to settle
        run: sleep 30

      - name: Smoke Test (Advisory by default)
        env:
          NICKSTIRE_HEALTH_URL: ${{ vars.NICKSTIRE_HEALTH_URL }}
          STATENOUR_HEALTH_URL: ${{ vars.STATENOUR_HEALTH_URL }}
          WORKER_HEALTH_URL: ${{ vars.WORKER_HEALTH_URL }}
          VOICE_HEALTH_URL: ${{ vars.VOICE_HEALTH_URL }}
          RAILWAY_SMOKE_STRICT: ${{ vars.RAILWAY_SMOKE_STRICT }}
        run: |
          check_url() {
            local name=$1
            local url=$2
            if [[ -n "$url" ]]; then
              echo "Checking $name health at $url..."
              if ! curl -sSf --retry 3 --retry-delay 5 "$url" > /dev/null; then
                echo "::warning::Health check failed for $name at $url"
                if [[ "$RAILWAY_SMOKE_STRICT" == "true" ]]; then
                  echo "Strict mode enabled. Failing job."
                  exit 1
                fi
              else
                echo "Health check passed for $name"
              fi
            else
              echo "Skipping $name: URL not configured in variables."
            fi
          }

          check_url "Nick's Tire" "$NICKSTIRE_HEALTH_URL"
          check_url "Statenour" "$STATENOUR_HEALTH_URL"
          check_url "Worker" "$WORKER_HEALTH_URL"
          check_url "Voice" "$VOICE_HEALTH_URL"

  # 2026-07-26 · two changes here, one of them a correction.
  #
  # (a) `security` added to needs + summary. Without it this job reported
  # "CI Pipeline Summary ... Node/Voice/Smoke all clean" on runs where the
  # repo's ONLY dependency gate was RED (30170985112, 30167641129,
  # 30164824567: security=failure, node=success, notify=success). A
  # summary that asserts health while a gate is red is false reassurance —
  # the one thing a summary must never do.
  #
  # (b) The "Fail on critical upstream failure" step was deleted. It could
  # never turn a green run red: node failures already fail their own
  # jobs and railway-smoke self-fails under strict mode. Verified across 60
  # runs — notify went red iff node was already failure/cancelled, zero
  # exceptions — and it gates no merge (branch protection is unavailable on
  # this plan). It also fired on merely-superseded runs, adding a red job
  # to a run that was only cancelled by concurrency.
  #
  # NOT the reason: the step was NOT misreporting causes. Its annotation
  # was correct ("Node CI job failed or was cancelled"); the
  # "Strict Smoke Tests failed." line that misled a diagnosis was GitHub
  # echoing the whole script source in the ##[group] block, where all
  # three hardcoded error strings appear regardless of which branch runs.
  # Packing three of them into one step is what made the log unreadable.
  notify:
    needs: [changes, node, security, railway-smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate Summary
        run: |
          cat <<EOF >> $GITHUB_STEP_SUMMARY
          ## CI Pipeline Summary
          
          **Changes Detected:**
          - Node/Turbo affected: \`${{ needs.changes.outputs.node }}\`
          - Docs only: \`${{ needs.changes.outputs.docs_only }}\`
          
          **Job Results:**
          - Node Job: \`${{ needs.node.result }}\`
          - Smoke Tests: \`${{ needs.railway-smoke.result }}\`
          - Security (advisories): \`${{ needs.security.result }}\`
          EOF

      - name: Notify Slack (Optional)
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [[ -n "${SLACK_WEBHOOK_URL:-}" ]]; then
            status="SUCCESS"
            if [[ "${{ needs.node.result }}" == "failure" ]]; then
              status="FAILED"
            fi
            
            message="GitHub Actions CI/CD completed for $GITHUB_REPOSITORY ($GITHUB_REF_NAME).\nStatus: $status"
            curl -s -X POST -H 'Content-type: application/json' \
              --data "{\"text\":\"$message\"}" \
              "$SLACK_WEBHOOK_URL" || true
          fi
          
