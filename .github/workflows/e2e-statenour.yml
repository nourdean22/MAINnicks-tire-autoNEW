# e2e-statenour · authenticated Playwright E2E in CI (2026-07-25)
#
# The last open item from the bdnick.info audit: "authenticated E2E
# coverage exists but is not gated". This job closes it HERMETICALLY —
# no operator secrets, no prod session:
#
#   · a throwaway pgvector Postgres service container is the database
#   · `prisma db push` materializes the schema (empty data = empty-state
#     rendering, which the smoke spec tolerates by design)
#   · `next build` runs as a SEPARATE type/prerender gate, then the suite
#     is served by `next dev` — not `next start`. That is deliberate and
#     load-bearing: the middleware honors AUTH_FORCE_MOCK strictly under
#     isDev, so mock auth works BECAUSE it is dev and would fail closed
#     under a production server. (Corrected 2026-07-28: this bullet used
#     to claim `next build` -> `next start`, describing an architecture
#     this workflow has never actually run.)
#   · boot-gate env vars are presence-checked dummies (lib/env.ts
#     asserts presence, not validity; nothing here can reach prod —
#     DATABASE_URL points at the container)
#   · tests/e2e/smoke.spec.ts runs against http://localhost:3001
#
# RED, BUT NOT MERGE-ENFORCED — corrected 2026-07-28. This job goes red on
# failure (`continue-on-error` is set nowhere), but nothing stops a merge on
# red: the repo is private on a plan without branch protection or rulesets
# (both APIs 403; branches/main reports protected:false), and AGENTS.md tells
# agents to self-merge with `gh pr merge --squash` — no `--auto`, so it merges
# regardless of check state. Observed: PR #1106 merged 9 SECONDS after `node`
# went red; #1103 and #1138 merged with checks still running.
# So the gate is the person or agent reading this. Treat red as a hard stop.
# If it flakes, demote deliberately with a dated comment, never silently.

name: e2e · statenour

on:
  pull_request:
    paths:
      - 'apps/statenour/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/e2e-statenour.yml'
  push:
    branches: [main]
    paths:
      - 'apps/statenour/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/e2e-statenour.yml'

concurrency:
  # PR refs share a per-ref group (so a new push supersedes the old
  # verdict); push-to-main runs get a UNIQUE group per commit.
  # 2026-07-26 · PR #1098 review (P1): cancel-in-progress:false is NOT
  # enough on a shared group — GitHub allows only ONE running + ONE
  # pending run per group, so a third qualifying push to main evicts
  # the pending one and that commit still goes unverified. Keying the
  # group on the sha removes main runs from contention entirely.
  group: e2e-statenour-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  # 2026-07-25 · NEVER cancel a main run. Superseding is right for PR
  # refs (a new push obsoletes the old verdict and saves runner
  # minutes) but on main each run is the ONLY verification that commit
  # will ever get — a later push from a concurrent session used to kill
  # it, leaving the merged commit with zero completed e2e verdicts
  # (witnessed on 5a421cb48). Merging a PR likewise cancels its own
  # in-flight run by deleting the ref, so the main run is the backstop.
  # Same expression test.yml (CI · turbo-affected verify) already uses.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      # ── hermetic database (the service container below) ──
      DATABASE_URL: postgresql://postgres:e2e_ci_pw@localhost:5432/statenour_e2e
      DIRECT_URL: postgresql://postgres:e2e_ci_pw@localhost:5432/statenour_e2e
      # ── boot-gate dummies · presence-only checks (lib/env.ts) ──
      AUTH_SECRET: e2e-ci-dummy-auth-secret-0000000000000000
      AUTH_GOOGLE_CLIENT_ID: e2e-ci-dummy.apps.googleusercontent.com
      AUTH_GOOGLE_CLIENT_SECRET: e2e-ci-dummy-secret
      AUTH_ALLOWED_EMAIL: e2e-ci@example.invalid
      CRON_SECRET: e2e-ci-dummy-cron-secret
      STATENOUR_SYNC_KEY: e2e-ci-dummy-sync-key
      OLLAMA_API_KEY: e2e-ci-dummy-ollama-key
      # ── the authenticated-session switch (same path as local dev) ──
      AUTH_FORCE_MOCK: "1"
      # ── classic-engine TCP switch: the Neon serverless adapter cannot
      # speak to a plain Postgres container (lib/prisma.ts guard) ──
      E2E_PLAIN_PG: "1"
      # ── hermetic marker: skips the tests that REQUIRE a real AI key
      # (assistant-reply roundtrip) — the operator-keyed extra ──
      E2E_HERMETIC: "1"
      PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING: "1"

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: e2e_ci_pw
          POSTGRES_DB: statenour_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 24 (matches Railway runtime)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Enable pgvector extension
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
          PGPASSWORD=e2e_ci_pw psql -h localhost -U postgres -d statenour_e2e -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Materialize schema (prisma db push, empty DB)
        working-directory: apps/statenour
        run: pnpm exec prisma db push --skip-generate

      - name: Build (deps + app · the type gate runs here)
        run: pnpm exec turbo build --filter=@statenour/web

      # Serve via `next dev`, NOT `next start`: the middleware honors
      # AUTH_FORCE_MOCK strictly under isDev (run 4 proved prod mode is
      # fail-closed with no mock path — by design; we do not weaken it).
      # Prod-build fidelity is still enforced by the separate build step
      # above (type gate + prerender). Dev cold-compiles per route, so
      # after the heartbeat we warm the heaviest pages before Playwright.
      - name: Start dev server (mock-auth is dev-mode-only by design)
        working-directory: apps/statenour
        run: |
          # 2026-07-26 · BOUND the dev server's heap — do not raise it.
          # Every exit-143 (SIGTERM mid-warm-loop: runs 30170514999 /
          # 30171051566 / 30202031893 / 30202479325) happened with the
          # job-level NODE_OPTIONS of --max-old-space-size=6144 in
          # effect (set in 75920fba8). A 6GB heap allowance on a ~7GB
          # runner that also hosts the pgvector service removes V8's GC
          # backpressure: the dev server grows while compiling 12 pages
          # + 8 API routes until the kernel takes the job down. The
          # first "fix" (e1e28c2f6) raised it to the SAME 6144 and was
          # therefore a no-op — which is why nothing changed.
          # MEASURED (run 30203022021): warming all 20 routes, the dev
          # server holds ~4.5GB — avail fell to 2259MB with it alive,
          # then jumped to 6728MB the instant it died. So 2560MB was too
          # LOW (V8 heap-aborted the server mid-loop; every later request
          # refused and 23 tests failed) and 6144MB was too HIGH (it grew
          # into the machine's ~7GB, shared with the pgvector service,
          # until the job took SIGTERM). 4096 sits below the observed
          # appetite — forcing GC — while leaving the OS ~2GB of room.
          # Build still gets the job-level headroom; only dev is capped.
          # 2026-07-26 · TURBOPACK (Next 16's default) instead of
          # --webpack. Measured with webpack: the server reached ~6.5GB
          # RSS warming 20 routes and the box (~7GB, shared with the
          # pgvector service) hit avail=386MB before the OOM killer took
          # it — with a 4096MB old-space cap already in place, proving
          # the cap bounds the JS heap but NOT webpack's native memory.
          # No heap number can fix that; a lighter compiler can.
          # Turbopack was originally avoided because it reports type
          # errors as warnings. That is irrelevant here, but NOT for the
          # reason first written: `next build` above does not run webpack
          # either (Next 16 defaults to Turbopack and the script passes no
          # bundler flag). The real type gate is `tsc --noEmit`, run by the
          # turbo-affected sweep in test.yml. Corrected 2026-07-28.
          NODE_OPTIONS="--max-old-space-size=4096" \
            nohup pnpm exec next dev -p 3001 > /tmp/next-start.log 2>&1 &
          # Stream the server's own output so a crash or heap abort is
          # visible INLINE — the previous `tail` ran after the loop and
          # never printed, because the job died first.
          tail -f /tmp/next-start.log | sed 's/^/  [next] /' &
          TAILPID=$!
          echo "waiting for heartbeat..."
          up=0
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/system/heartbeat || true)
            if [ "$code" = "200" ]; then echo "up after $((i*2))s"; up=1; break; fi
            sleep 2
          done
          if [ "$up" != "1" ]; then echo "server never came up"; tail -50 /tmp/next-start.log; exit 1; fi
          echo "warming pages (dev cold-compiles each route; be patient)..."
          # `ps -C node` (used in e1e28c2f6) NEVER matched the dev
          # server — Next renames its process to `next-server`, so the
          # 43MB reading that "refuted" memory was measuring the wrong
          # process. Report free memory + the two largest processes by
          # RSS instead, whatever they are called.
          probe() { echo "$(free -m | awk '/^Mem:/ {print "avail="$7"MB"}') · $(ps -eo rss=,comm= --sort=-rss | head -2 | awk '{printf "%s:%dMB ", $2, $1/1024}')"; }
          # 2026-07-28 · warm() ABORTS on a dead server. Previously every
          # request ended in `|| echo timeout` and nothing inspected $code,
          # so when the dev server died mid-loop the step still exited 0 and
          # the real cause surfaced six minutes later as a pile of unrelated
          # Playwright failures (run 30203022021: 23 failed, every one a
          # symptom). A 000 means no HTTP response at all — the server is
          # gone, and nothing downstream can be trusted.
          # NOTE: -m 300 is deliberately NOT tightened. A cold tRPC route was
          # measured at 72s under webpack; a shorter cap would abort honest
          # compiles. A wedged route is already bounded by the job timeout.
          # 2026-07-28 · capture curl's EXIT STATUS, don't infer failure from
          # the body. PR #1141 review (P2), reproduced locally against an
          # unreachable port: on a connect failure or timeout curl still emits
          # its --write-out format ("000") AND returns nonzero, so
          # `$(curl ... || echo "000")` yields "000000" — the equality check
          # could never match and the abort was a NO-OP. `|| rc=$?` keeps the
          # step's `set -e` from firing while preserving the real status.
          warm() {
            local path="$1"
            local code rc=0
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 300 "http://localhost:3001$path") || rc=$?
            echo "  warm $path -> ${code:-none} (curl rc=$rc) · $(probe)"
            if [ "$rc" -ne 0 ] || [ "$code" = "000" ]; then
              echo "::error::dev server stopped answering while warming $path — aborting rather than running Playwright against a dead server"
              echo "--- next dev log tail ---"; tail -40 /tmp/next-start.log || true
              exit 1
            fi
          }
          # 2026-07-28 · this list now matches what smoke.spec.ts actually
          # asserts: /missions is tested (it replaced /intelligence/brief,
          # whose AI-RSC stream never completes hermetically) so it is the
          # one that must be warm. Warming /intelligence/brief instead spent
          # budget compiling a route no test touches while leaving a tested
          # route to cold-compile inside Playwright's per-test budget.
          for p in / /chat /system /stats /brain /content /pins /photo-improver /missions /system/ai-cost /system/health /system/cockpit-observability; do
            warm "$p"
          done
          # 2026-07-25 · warm the API-contract routes too. The smoke's API
          # tests use a 10s request cap — a fine bound for a WARMED route,
          # but next dev cold-compiles each route on first hit, which blew
          # the cap nondeterministically (rate-limits/costs/intel flaked in
          # the PR #1089 run; run 8 only passed on timing luck). Status is
          # irrelevant here — compilation happens regardless of auth.
          echo "warming API routes..."
          for p in /api/system/rate-limits "/api/trpc/system.costs?input=%7B%22days%22%3A7%7D" /api/intel "/api/content/history?days=30" /api/social/recent-images /api/brain/wisdom /api/trpc/observability.osSnapshot "/api/trpc/system.promptDiagnostics?input=%7B%22msg%22%3A%22warmup%22%7D"; do
            warm "$p"
          done
          # Liveness gate: the heartbeat was only checked BEFORE the warm
          # loops, so a server that died during them went undetected.
          hb_rc=0
          final=$(curl -s -o /dev/null -w "%{http_code}" -m 30 http://localhost:3001/api/system/heartbeat) || hb_rc=$?
          if [ "$hb_rc" -ne 0 ] || [ "$final" != "200" ]; then
            echo "::error::dev server is not healthy after warmup (heartbeat -> ${final:-none}, curl rc=$hb_rc) — aborting before Playwright"
            echo "--- next dev log tail ---"; tail -40 /tmp/next-start.log || true
            kill $TAILPID 2>/dev/null || true
            exit 1
          fi
          echo "post-warm heartbeat -> $final · server healthy"
          kill $TAILPID 2>/dev/null || true

      - name: Install Playwright chromium
        working-directory: apps/statenour
        run: pnpm exec playwright install --with-deps chromium

      - name: Run authenticated E2E smoke
        working-directory: apps/statenour
        env:
          E2E_BASE_URL: http://localhost:3001
          CI: "true"
        # 120s per-test budget: even warmed, dev-mode hydration on a
        # 2-core runner is slower than the 30s default assumes.
        run: pnpm exec playwright test --timeout=120000

      - name: Server log on failure
        if: failure()
        run: tail -100 /tmp/next-start.log || true

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: apps/statenour/test-results/
          retention-days: 7
