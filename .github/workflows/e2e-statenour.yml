# e2e-statenour · authenticated Playwright E2E in CI (2026-07-25)
#
# The last open item from the bdnick.info audit: "authenticated E2E
# coverage exists but is not gated". This job closes it HERMETICALLY —
# no operator secrets, no prod session:
#
#   · a throwaway pgvector Postgres service container is the database
#   · `prisma db push` materializes the schema (empty data = empty-state
#     rendering, which the smoke spec tolerates by design)
#   · `next build` runs as a SEPARATE type/prerender gate, then the suite
#     is served by `next dev` — not `next start`. That is deliberate and
#     load-bearing: the middleware honors AUTH_FORCE_MOCK strictly under
#     isDev, so mock auth works BECAUSE it is dev and would fail closed
#     under a production server. (Corrected 2026-07-28: this bullet used
#     to claim `next build` -> `next start`, describing an architecture
#     this workflow has never actually run.)
#   · boot-gate env vars are presence-checked dummies (lib/env.ts
#     asserts presence, not validity; nothing here can reach prod —
#     DATABASE_URL points at the container)
#   · tests/e2e/smoke.spec.ts runs against http://localhost:3001
#
# RED, BUT NOT MERGE-ENFORCED — corrected 2026-07-28. This job goes red on
# failure (`continue-on-error` is set nowhere), but nothing stops a merge on
# red: the repo is private on a plan without branch protection or rulesets
# (both APIs 403; branches/main reports protected:false), and AGENTS.md tells
# agents to self-merge with `gh pr merge --squash` — no `--auto`, so it merges
# regardless of check state. Observed: PR #1106 merged 9 SECONDS after `node`
# went red; #1103 and #1138 merged with checks still running.
# So the gate is the person or agent reading this. Treat red as a hard stop.
# If it flakes, demote deliberately with a dated comment, never silently.

name: e2e · statenour

on:
  pull_request:
    paths:
      - 'apps/statenour/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/e2e-statenour.yml'
  push:
    branches: [main]
    paths:
      - 'apps/statenour/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/e2e-statenour.yml'

concurrency:
  # PR refs share a per-ref group (so a new push supersedes the old
  # verdict); push-to-main runs get a UNIQUE group per commit.
  # 2026-07-26 · PR #1098 review (P1): cancel-in-progress:false is NOT
  # enough on a shared group — GitHub allows only ONE running + ONE
  # pending run per group, so a third qualifying push to main evicts
  # the pending one and that commit still goes unverified. Keying the
  # group on the sha removes main runs from contention entirely.
  group: e2e-statenour-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  # 2026-07-25 · NEVER cancel a main run. Superseding is right for PR
  # refs (a new push obsoletes the old verdict and saves runner
  # minutes) but on main each run is the ONLY verification that commit
  # will ever get — a later push from a concurrent session used to kill
  # it, leaving the merged commit with zero completed e2e verdicts
  # (witnessed on 5a421cb48). Merging a PR likewise cancels its own
  # in-flight run by deleting the ref, so the main run is the backstop.
  # Same expression test.yml (CI · turbo-affected verify) already uses.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      # ── hermetic database (the service container below) ──
      DATABASE_URL: postgresql://postgres:e2e_ci_pw@localhost:5432/statenour_e2e
      DIRECT_URL: postgresql://postgres:e2e_ci_pw@localhost:5432/statenour_e2e
      # ── boot-gate dummies · presence-only checks (lib/env.ts) ──
      AUTH_SECRET: e2e-ci-dummy-auth-secret-0000000000000000
      AUTH_GOOGLE_CLIENT_ID: e2e-ci-dummy.apps.googleusercontent.com
      AUTH_GOOGLE_CLIENT_SECRET: e2e-ci-dummy-secret
      AUTH_ALLOWED_EMAIL: e2e-ci@example.invalid
      CRON_SECRET: e2e-ci-dummy-cron-secret
      STATENOUR_SYNC_KEY: e2e-ci-dummy-sync-key
      OLLAMA_API_KEY: e2e-ci-dummy-ollama-key
      # ── the authenticated-session switch (same path as local dev) ──
      AUTH_FORCE_MOCK: "1"
      # ── classic-engine TCP switch: the Neon serverless adapter cannot
      # speak to a plain Postgres container (lib/prisma.ts guard) ──
      E2E_PLAIN_PG: "1"
      # ── hermetic marker: skips the tests that REQUIRE a real AI key
      # (assistant-reply roundtrip) — the operator-keyed extra ──
      E2E_HERMETIC: "1"
      PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING: "1"

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: e2e_ci_pw
          POSTGRES_DB: statenour_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node 24 (matches Railway runtime)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Enable pgvector extension
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
          PGPASSWORD=e2e_ci_pw psql -h localhost -U postgres -d statenour_e2e -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Materialize schema (prisma db push, empty DB)
        working-directory: apps/statenour
        run: pnpm exec prisma db push --skip-generate

      - name: Build (deps + app · the type gate runs here)
        run: pnpm exec turbo build --filter=@statenour/web

      # Serve via `next dev`, NOT `next start`: the middleware honors
      # AUTH_FORCE_MOCK strictly under isDev (run 4 proved prod mode is
      # fail-closed with no mock path — by design; we do not weaken it).
      # Prod-build fidelity is still enforced by the separate build step
      # above (type gate + prerender). Dev cold-compiles per route, so
      # after the heartbeat we warm the heaviest pages before Playwright.
      - name: Start dev server (mock-auth is dev-mode-only by design)
        working-directory: apps/statenour
        run: |
          # 2026-07-26 · BOUND the dev server's heap — do not raise it.
          # Every exit-143 (SIGTERM mid-warm-loop: runs 30170514999 /
          # 30171051566 / 30202031893 / 30202479325) happened with the
          # job-level NODE_OPTIONS of --max-old-space-size=6144 in
          # effect (set in 75920fba8). A 6GB heap allowance on a ~7GB
          # runner that also hosts the pgvector service removes V8's GC
          # backpressure: the dev server grows while compiling 12 pages
          # + 8 API routes until the kernel takes the job down. The
          # first "fix" (e1e28c2f6) raised it to the SAME 6144 and was
          # therefore a no-op — which is why nothing changed.
          # MEASURED (run 30203022021): warming all 20 routes, the dev
          # server holds ~4.5GB — avail fell to 2259MB with it alive,
          # then jumped to 6728MB the instant it died. So 2560MB was too
          # LOW (V8 heap-aborted the server mid-loop; every later request
          # refused and 23 tests failed) and 6144MB was too HIGH (it grew
          # into the machine's ~7GB, shared with the pgvector service,
          # until the job took SIGTERM). 4096 sits below the observed
          # appetite — forcing GC — while leaving the OS ~2GB of room.
          # Build still gets the job-level headroom; only dev is capped.
          # 2026-07-26 · TURBOPACK (Next 16's default) instead of
          # --webpack. Measured with webpack: the server reached ~6.5GB
          # RSS warming 20 routes and the box (~7GB, shared with the
          # pgvector service) hit avail=386MB before the OOM killer took
          # it — with a 4096MB old-space cap already in place, proving
          # the cap bounds the JS heap but NOT webpack's native memory.
          # No heap number can fix that; a lighter compiler can.
          # Turbopack was originally avoided because it reports type
          # errors as warnings. That is irrelevant here, but NOT for the
          # reason first written: `next build` above does not run webpack
          # either (Next 16 defaults to Turbopack and the script passes no
          # bundler flag). The real type gate is `tsc --noEmit`, run by the
          # turbo-affected sweep in test.yml. Corrected 2026-07-28.
          # 2026-08-26 · start + readiness moved to scripts/ci/wait-for-dev-server.sh
          # (canary: scripts/agent-os/wait-for-dev-server.test.mjs, run by
          # `pnpm agent:verify` on every PR).
          #
          # The loop that used to live here could not tell two OPPOSITE states
          # apart, and treated both as "keep waiting":
          #   · the port is not accepting yet   — resolves on its own
          #   · the port IS accepting, and a route that exists returns 404
          #     — a latched resolution that waiting makes permanent
          #
          # Every e2e failure sampled on 2026-08-26 was the second one, and it
          # is not a test failure: Playwright never ran. Runs 32983503600,
          # 32894843745, 32876917977, 32683986110, 32605539562 — 5 of 5, back
          # to 08-22 — all show `✓ Ready in 430ms`, then the first heartbeat
          # resolving to /_not-found (an 11.1s compile), then 404 in ~40ms for
          # the whole 180s budget. Passing runs answer 200 in ~1.9s with zero
          # 404s. The step then printed "server never came up" about a server
          # that had come up and answered 199 requests.
          #
          # The script draws that distinction, restarts ONCE on the latched
          # state (clearing .next first), and fails loudly and specifically if
          # the restart does not take. The latch itself is upstream in
          # Turbopack's route resolution and is NOT fixed here.
          START_CMD="pnpm exec next dev -p 3001" \
          NODE_OPTIONS="--max-old-space-size=4096" \
          PORT=3001 \
          HEALTH_PATH=/api/system/heartbeat \
          LOG_FILE=/tmp/next-start.log \
          LISTEN_WAIT=180 \
          SERVE_WAIT=45 \
            bash ../../scripts/ci/wait-for-dev-server.sh
          # 2026-08-28 · the warm loop moved to scripts/ci/warm-routes.sh
          # (canary: scripts/agent-os/warm-routes.test.mjs, run by
          # `pnpm agent:verify` on every PR). Same defect class, and the same
          # reason, as the readiness probe's move on 08-26: the loop could not
          # tell two OPPOSITE states apart and printed one message for both.
          #
          #   curl rc=7 / 000   the server is GONE. Nothing downstream is safe.
          #   curl rc=28        the server did not ANSWER IN TIME — which it can
          #                     do while perfectly alive, with one route wedged.
          #
          # It tested `[ "$rc" -ne 0 ] || [ "$code" = "000" ]` and called both
          # "dev server stopped answering". EVERY /api/intel failure sampled on
          # 2026-08-28 (runs 33203747058, 33200855271, 33192651269, 33115876891
          # — 4 of 4, back to 08-27) was rc=28 with the server ALIVE: the dev
          # log's last line is `Compiling /api/intel ...` and nothing follows,
          # while the handler's own `start GET` trace never prints. The compile
          # wedges upstream of the route; the handler never runs.
          #
          # /api/intel is NOT the culprit and is NOT droppable from this list.
          # smoke.spec.ts asserts its shape (ok · industry · generatedAt), and
          # its incremental compile is 671 lines across 4 files with no new
          # dependencies — apiHandler's entire graph was already compiled by
          # /api/system/rate-limits, the SAME apiHandler(auth:"owner") wrapper,
          # 20s earlier. On the passing re-run of the identical commit it warmed
          # in 330ms. 330ms vs >300s is bimodal: a deadlock, not slowness.
          #
          # Memory is the accomplice, not the cause — and the PASSING run proves
          # it, because it had the LEAST free memory at that point (526MB, vs
          # 634-843MB in all four failures) and compiled the route fine. Peak
          # next-server RSS is 6.1-6.3GB on a ~7GB runner in both outcomes, so
          # do not "fix" this by tuning the heap again.
          #
          # ROUTE_TIMEOUT 300 -> 120 is a LOOSENING relative to reality, not a
          # tightening. The 300s cap (and the 72s figure behind it) was measured
          # under webpack; this job has run Turbopack since 07-26. Measured
          # Turbopack cold compiles in these same runs: heartbeat 7.5s, / 12.3s,
          # /chat 14.0s, /api/trpc/[trpc] 20.1s — the heaviest entrypoint in the
          # app. 120s is 6x the observed worst case and a wedged route is
          # unbounded, so no honest compile is at risk. What 300 bought was five
          # minutes of silence per occurrence.
          #
          # The route list is UNCHANGED. Pages first (dev cold-compiles each),
          # then the API-contract routes: the smoke's API tests use a 30s cap,
          # fine for a WARMED route but not for a cold compile. /missions is
          # tested (it replaced /intelligence/brief, whose AI-RSC stream never
          # completes hermetically) so it is the one that must be warm.
          echo "warming routes (dev cold-compiles each; be patient)..."
          # A command substitution, not a heredoc: a `run: |` block is a YAML
          # block scalar, and a heredoc's terminator must sit at column 0 —
          # which ends the scalar and stops the workflow parsing entirely.
          # Each path is single-quoted so a query string's `?` is never
          # glob-expanded. warm-routes.sh trims the indentation back off.
          ROUTES=$(
            echo '/'
            echo '/chat'
            echo '/system'
            echo '/stats'
            echo '/brain'
            echo '/content'
            echo '/pins'
            echo '/photo-improver'
            echo '/missions'
            echo '/system/ai-cost'
            echo '/system/health'
            echo '/system/cockpit-observability'
            echo '/api/system/rate-limits'
            echo '/api/trpc/system.costs?input=%7B%22days%22%3A7%7D'
            echo '/api/intel'
            echo '/api/content/history?days=30'
            echo '/api/social/recent-images'
            echo '/api/brain/wisdom'
            echo '/api/trpc/observability.osSnapshot'
            echo '/api/trpc/system.promptDiagnostics?input=%7B%22msg%22%3A%22warmup%22%7D'
          )
          # On a wedge the per-route retry cannot clear, restart the dev server
          # once and re-warm from cold. kill_port comes from
          # wait-for-dev-server.sh (WFDS_LIB=1 defines its functions and runs
          # nothing) because a restart onto a held port is worse than no restart:
          # `next dev` spawns children, the new process would die with
          # EADDRINUSE, and every later probe would answer from the ORIGINAL
          # wedged server. Sourced inside a subshell so that script's own
          # defaults cannot leak into warm-routes'. CLEAR_DIR is emptied
          # deliberately: the wedge is compiler state, not a bad build artifact,
          # so clearing .next would cost a full cold rebuild for nothing.
          export BASE_URL=http://localhost:3001
          export HEALTH_PATH=/api/system/heartbeat
          export LOG_FILE=/tmp/next-start.log
          export ROUTE_TIMEOUT=120
          export HEALTH_TIMEOUT=30
          export RETRIES=1
          export MAX_RESTARTS=1
          export ROUTES
          # `export` as its own statement, NOT an assignment prefix. Bash removes
          # prefix assignments once the builtin returns, so `WFDS_LIB=1 . f` left
          # PORT unset and kill_port died on `set -u` before touching the port —
          # a restart that frees nothing, onto a port the wedged server still
          # holds. wait-for-dev-server.test.mjs had already documented this exact
          # trap; the first draft of this line reproduced it anyway. Chained with
          # && so a failed kill aborts the restart instead of racing EADDRINUSE.
          export RESTART_CMD='( export WFDS_LIB=1 PORT=3001; . ../../scripts/ci/wait-for-dev-server.sh && kill_port ) && START_CMD="pnpm exec next dev -p 3001" NODE_OPTIONS="--max-old-space-size=4096" PORT=3001 LISTEN_WAIT=180 SERVE_WAIT=45 CLEAR_DIR= bash ../../scripts/ci/wait-for-dev-server.sh'
          bash ../../scripts/ci/warm-routes.sh
          # warm-routes.sh runs the post-warm liveness gate itself and exits
          # nonzero if the heartbeat is unhealthy, so nothing is left to check
          # here. Kill whichever tail is current — a restart starts a new one.
          kill "$(cat /tmp/.dev-tail.pid 2>/dev/null || echo 0)" 2>/dev/null || true
      - name: Install Playwright chromium
        working-directory: apps/statenour
        run: pnpm exec playwright install --with-deps chromium

      - name: Run authenticated E2E smoke
        working-directory: apps/statenour
        env:
          E2E_BASE_URL: http://localhost:3001
          CI: "true"
        # 120s per-test budget: even warmed, dev-mode hydration on a
        # 2-core runner is slower than the 30s default assumes.
        run: pnpm exec playwright test --timeout=120000

      - name: Server log on failure
        if: failure()
        run: tail -100 /tmp/next-start.log || true

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-traces
          path: apps/statenour/test-results/
          retention-days: 7
