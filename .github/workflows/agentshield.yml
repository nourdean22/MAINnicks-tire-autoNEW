name: AgentShield config scan

# Scans the agent control plane's CONFIG (.claude/: settings, hooks, agents, skills,
# slash commands, MCP references) with ecc-agentshield (affaan-m/agentshield, MIT;
# docs/UPSTREAMS.md row dated 2026-10-16). The repo's own guard, scripts/agent-os/
# pretool.mjs, judges COMMANDS at tool-call time; nothing judged the files that
# define that guard, the hooks sibling sessions edit, or the installed plugins.
#
# Advisory on purpose (first adoption, operator go 2026-10-16): the real scan's
# findings land in the job summary and never fail the job. What DOES fail the job
# is the canary: a planted fixture (scripts/agent-os/fixtures/agentshield-canary/)
# carries a SessionStart hook that pipes curl into sh; the scanner must flag it
# (rule hooks-session-start-download) before its silence on the real tree means
# anything. Root AGENTS.md: "Ship the canary, not just the control."
#
# Network: `npx` fetches the pinned package from npm; the scan itself is local.
# Never add --opus / --injection (send configs to a model), --supply-chain-online
# (npm metadata per MCP package) or --fix (edits files); agentshieldCanary.test.mjs
# fails if one appears.
#
# NOTE: this repo has no branch protection, so a red run does not mechanically
# block `gh pr merge`. Red means stop, by convention.

on:
  pull_request:
    branches: [main]
    paths:
      - ".claude/**"
      - "config/agent-os/**"
      - "scripts/agent-os/agentshield-canary.mjs"
      - "scripts/agent-os/fixtures/agentshield-canary/**"
      - ".github/workflows/agentshield.yml"
  push:
    branches: [main]
    paths:
      - ".claude/**"
      - "config/agent-os/**"
      - ".github/workflows/agentshield.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same PR supersedes the older run; a push to main gets a group of its own per
  # commit and is never cancelled (the old shared group cancelled main runs). Same shape as
  # agent-policy.yml; scripts/agent-os/workflowCostGuards.test.mjs asserts it for every PR+push workflow.
  group: agentshield-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'push' && github.sha || 'run' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: agentshield (canary gate, then advisory scan of .claude)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      # Positive control: the scanner must see the planted hook. Exit 2 is "critical
      # finding present" (the expected outcome); 0 is "nothing critical"; 1 is a
      # crash. The assert script reads the JSON, so the exit code is informational.
      - name: canary scan of the planted fixture
        run: |
          set +e
          npx --yes ecc-agentshield@1.6.0 scan --path scripts/agent-os/fixtures/agentshield-canary/.claude --format json --output /tmp/agentshield-canary.json
          echo "canary scan exit=$?"
          set -e
          node scripts/agent-os/agentshield-canary.mjs assert /tmp/agentshield-canary.json

      - name: advisory scan of the real .claude (findings to the job summary, never red)
        continue-on-error: true
        run: |
          set +e
          npx --yes ecc-agentshield@1.6.0 scan --path .claude --format json --output /tmp/agentshield.json
          echo "real scan exit=$?"
          npx --yes ecc-agentshield@1.6.0 scan --path .claude --format markdown --output /tmp/agentshield.md
          set -e
          node scripts/agent-os/agentshield-canary.mjs summarize /tmp/agentshield.json
          {
            echo "## AgentShield advisory scan of .claude"
            echo
            cat /tmp/agentshield.md
          } >> "$GITHUB_STEP_SUMMARY"
