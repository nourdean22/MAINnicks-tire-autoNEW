name: Dependency Review
on: [pull_request]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Dependency Review
        # Non-blocking, and currently a NO-OP that reports a decorative green.
        #
        # This action errors with "Dependency review is not supported on this
        # repository" and continue-on-error swallows it. An earlier version of
        # this comment said enabling Dependency Graph in Settings would make it
        # start reporting real findings. That is NOT true for this repo: the
        # action requires a PUBLIC repo, or private + GitHub Advanced Security.
        # This repo is private and owned by a personal account, and GHAS is an
        # Enterprise-org product — so no setting change makes this job real.
        #
        # Do not count this as dependency scanning. The actual gate is the
        # "Dependency audit" step in test.yml (scripts/audit-advisories.mjs).
        # Enabling Dependency Graph + Dependabot alerts IS still worth doing —
        # it catches new CVEs in existing deps, which no CI run does — but it
        # does not revive this job.
        continue-on-error: true
        uses: actions/dependency-review-action@v5
