name: Dependency Review
on: [pull_request]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Dependency Review
        # Non-blocking: the repo does not have GitHub Dependency Graph
        # enabled, so this action errors with "Dependency review is not
        # supported on this repository". Keep the job green until the graph
        # is enabled in Settings -> Security & analysis, at which point this
        # begins reporting real findings without gating every PR.
        continue-on-error: true
        uses: actions/dependency-review-action@v5
