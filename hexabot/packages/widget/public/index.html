<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Widget Embed</title>
    <script
      crossorigin
      src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"
    ></script>
    <script
      crossorigin
      src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"
    ></script>
    <link rel="stylesheet" href="./style.css" />
    <script src="./hexabot-widget.umd.js"></script>
  </head>
  <body>
    <div id="hexabot-chat-widget"></div>
    <script>
      ReactDOM.render(
        React.createElement(HexabotWidget, {
          apiUrl: "http://localhost:3000",
          channel: "web",
          sourceId: "replace-with-source-id",
          primaryColor: "#29998e",
          language: "en",
          transport: "ws",
        }),
        document.getElementById("hexabot-chat-widget"),
      );
    </script>
  </body>
</html>
