# gitleaks configuration — extends the default ruleset, never replaces it.
#
# The secret-scan workflow is a HARD gate on `base..head` for every PR. It stayed
# green for months, then failed on 2026-08-15 for a PR that re-added ONE committed
# prerendered page. The finding:
#
#   RuleID  generic-api-key
#   Match   data-key="<32-char token>"
#   File    apps/nickstire/prerendered/reviews/index.html
#
# That is the **Ahrefs Web Analytics site key**, on their tracking script tag:
#
#   <script src="https://analytics.ahrefs.com/analytics.js" data-key="..."></script>
#
# It is public by design — the analogue of a GA measurement ID or a Meta Pixel ID.
# It is injected client-side from `apps/nickstire/client/index.html`, so it ships
# to every browser that loads the site. Receipts taken before writing this file:
#
#   · `curl https://nickstire.org/` serves the attribute to any caller
#   · the same script tag is in 344 prerendered files already on `main`
#   · its only source is a <script> tag in the client entry HTML
#
# Nothing leaked. The gate had simply never scanned a re-added prerendered file
# before, and it would fire again on the next one — including a prerender refresh,
# if one ever came through a PR.
#
# SCOPING — why `regexTarget = "match"`:
# The default target is the bare secret, which here is a 32-character token; a
# regex for that would exempt any 32-character token anywhere in the repo, which
# is a real hole. The obvious alternative, `regexTarget = "line"`, is WORSE here:
# these prerendered files are minified, so "the line" is 15,487 characters of the
# entire document body, and a genuine secret sharing that line would be exempted
# with it. "match" tests only the matched text — `data-key="..."` — which is an
# HTML data attribute and therefore client-visible by construction.
#
# `useDefault = true` keeps every default rule. Every other file, rule and finding
# is scanned exactly as before.
#
# An earlier version of this file allowlisted the google-site-verification meta
# tag instead. That was a GUESS at what was failing, made while the gate reported
# only "leaks found: 1" with no rule or file, and it was wrong — the tag is
# genuinely public, but it was never the finding. It has been removed rather than
# left in place: a security exception nothing can justify is worse than none. The
# workflow now prints its findings, so the next failure needs no guessing.

[extend]
useDefault = true

[allowlist]
description = "Ahrefs Web Analytics site key — a public client-side identifier, required in served HTML"
regexTarget = "match"
regexes = [
  '''data-key=["'][A-Za-z0-9+/=_-]{16,64}["']''',
  # THE SAME KEY, THE OTHER SHAPE (added 2026-09-10). The regex above matches
  # the rendered HTML ATTRIBUTE `data-key="..."`, which exists in 339 files.
  # The key also appears as a JavaScript CALL - `setAttribute('data-key', '...')`,
  # a comma rather than an `=` - in 340, including client/index.html itself,
  # which is where the prerendered copies come from. The regex above never
  # matched that form, so the entry read as if it covered the Ahrefs key while
  # covering only half of it. It went unnoticed because gitleaks scans
  # base..head: the 336 pre-existing files are not new lines in any range. Three
  # re-added careers leaf pages put the call form back in a diff and the gate
  # fired on line 173 of each.
  #
  # Written against the MATCH TEXT, not the source line: regexTarget="match"
  # above means each allowlist regex is applied to what the rule captured,
  # which gitleaks reported as `data-key', '<value>'` - no `setAttribute`, no
  # closing paren. A regex written against the full line looks right in review
  # and never fires, which is the same failure this entry is fixing.
  #
  # Matched by EXACT VALUE, following the IndexNow entry below, so this cannot
  # exempt any other token - only this specific Ahrefs
  # Web Analytics site key, which is served in plaintext to every visitor of
  # every page and is public by design, exactly like a GA measurement ID.
  "data-key', 'DCheKV/YJsF9d6vmJuHNBg'",
  # IndexNow verification key — same shape of false positive as the Ahrefs
  # entry above (a required public identifier, flagged only because gitleaks
  # scans base..head and this was the first PR to introduce it as new lines).
  # It is a domain-ownership verification token for the IndexNow protocol
  # (indexnow.org): the protocol REQUIRES it be served in plaintext at
  # <site>/<key>.txt so search engines can read it back and confirm the
  # submitter controls the domain — publicness is the entire mechanism, not
  # an accident. Receipts: `server/_core/index.ts` has served this exact
  # value at that exact route (GET /d274e03f24e4438599616695d23dab67.txt) on
  # `main` since before this entry was added — `curl
  # https://nickstire.org/d274e03f24e4438599616695d23dab67.txt` returns it to
  # any caller — and that occurrence never tripped this gate because it
  # entered the repo in a different PR's base..head range; PR #2254 added a
  # second occurrence, in scripts/indexnow-submit.mjs, as new lines in its
  # own range, which is what fired. Matched by exact value, not a general
  # pattern, so this cannot exempt any other 32-character token — only this
  # specific published verification key, which is already public regardless
  # of what this file says.
  '''INDEXNOW_KEY = "d274e03f24e4438599616695d23dab67"''',
]
# Test-fixture tokens for the agent-bridge scope canary are SYNTHETIC — the
# file asserts token->scope resolution and never contains a real secret. Path-
# allowlisted (not by value) so the whole PR range is clean regardless of how a
# fixture was worded in an earlier commit. Added 2026-08-27 with PR #1944.
paths = [
  '''apps/statenour/tests/agent-bridge/bridge-hardening\.test\.ts''',
  # Same shape, same reasoning, added 2026-09-02 with PR #2090. The fixture is
  # a BrainMemory `key` for a wisdom row — the component test asserts that the
  # `nick_advice_` PREFIX resolves to the `chat-scrape` origin, and that a row
  # renders a deep link. It has never held a credential; there is no credential
  # surface in a see-also list.
  #
  # The suffix was a cuid-shaped fragment, whose entropy matched
  # generic-api-key. It is a plain word in the current tree — but the gate
  # scans `base..head`, so the earlier commit in this PR's own range still
  # carries the old wording and the gate still fires. Path-allowlisted for the
  # reason the entry above gives: by value would leave the range red, and
  # rewriting a pushed commit to launder a false positive is a worse trade
  # than one narrowly-scoped test path.
  #
  # The cost, stated plainly: a real secret committed to THIS ONE component
  # test file would not be caught. Every other file is scanned as before.
  '''apps/statenour/tests/components/related-wisdom-links\.test\.tsx''',
  # Render-fingerprint fixtures, added 2026-10-01 with PR #2865. The file pins
  # the static-family and carousel-territory renderers by sha256 of their HTML
  # (19 hashes) so the visual-language mapping can be proven byte-identical.
  # One key is the territory id `blueprint_xray`, and `xray` is a JFrog keyword:
  # the jfrog-identity-token rule matched that ONE 64-hex fingerprint and no
  # other. Path-allowlisted, not by value, because the hashes change whenever a
  # render legitimately changes and an exact-value entry would fire again on
  # the next repin. Same cost as the entries above: a real secret in this one
  # fixture file would not be caught; every other file is scanned as before.
  '''apps/nickstire/server/visualLanguageParity\.test\.ts''',
]
