# camera-bridge v2: Mosquitto (auth) + Frigate 0.17.2 + visitd.
# Default profile runs on Docker Desktop / WSL2 (CPU detector, no device mounts).
# Linux production adds the iGPU:  docker compose -f docker-compose.yml -f docker-compose.linux.yml up -d
# Bootstrap first (see README "Mosquitto bootstrap"): mosquitto/passwd must exist before `up`.

services:
  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: camera_mqtt
    restart: unless-stopped
    ports:
      - "127.0.0.1:1883:1883"          # loopback only; containers reach it as mqtt:1883 on the compose network
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      - mqtt_data:/mosquitto/data
      - mqtt_log:/mosquitto/log
    # No env_file here on purpose: the broker needs no secrets beyond the passwd file.

  frigate:
    image: ghcr.io/blakeblackshear/frigate:0.17.2   # pin; never `stable` (flips to 0.18 on release)
    container_name: frigate
    restart: unless-stopped
    shm_size: "256mb"                  # 2 x 1280x720 detect streams + LPR headroom
    stop_grace_period: 30s
    # Linux iGPU (VAAPI / OpenVINO GPU) lives in docker-compose.linux.yml:
    # devices:
    #   - /dev/dri/renderD128:/dev/dri/renderD128
    volumes:
      - ./frigate/config:/config       # mount the DIRECTORY (0.13+): Frigate writes frigate.db and model cache next to config.yml
      - ./storage/media:/media/frigate
      - ./fixtures:/media/fixtures:ro  # looped MP4 for the `replay` camera (scripts/replay-fixture.ps1)
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    ports:
      - "127.0.0.1:5000:5000"          # unauthenticated API: loopback only (visitd never needs it; humans use 8971)
      - "8971:8971"                    # authenticated UI (JWT); expose over Tailscale ACL, never port-forward
      - "127.0.0.1:8554:8554"          # go2rtc RTSP restream is unauthenticated: loopback only (Frigate reads it there)
      - "127.0.0.1:8555:8555/tcp"      # WebRTC, same rule; the 8971 UI falls back to MSE over Tailscale.
      - "127.0.0.1:8555:8555/udp"      # Rebind to the LAN only for a deliberate VLC/WebRTC check, then revert.
    environment:
      - FRIGATE_RTSP_PASSWORD=${FRIGATE_RTSP_PASSWORD}
      - FRIGATE_MQTT_PASSWORD=${FRIGATE_MQTT_PASSWORD}
    depends_on:
      mqtt:
        condition: service_started

  visitd:
    build:
      context: .
      dockerfile: visitd.Dockerfile
    image: camera-bridge/visitd:2.1.0
    container_name: visitd
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"          # Prometheus text (README section 4 step 5), loopback only on the host. Inside the
                                       # container set metrics.host: 0.0.0.0 in config.yaml: its loopback is not the host's.
    env_file:
      - .env                           # STATENOUR_SYNC_KEY, MQTT_USERNAME, MQTT_PASSWORD
    environment:
      - VISITD_CONFIG=/config/config.yaml
      - VISITD_LEDGER=/data/visitd.sqlite
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ./data:/data                   # SQLite ledger + outbox survive restarts and image rebuilds
    # network_mode: host is not supported on Docker Desktop; visitd reaches the broker as `mqtt` on the compose network.
    depends_on:
      mqtt:
        condition: service_started
      frigate:
        condition: service_started

volumes:
  mqtt_data:
  mqtt_log:
