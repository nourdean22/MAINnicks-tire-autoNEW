# Lab-only compose: broker + visitd, no Frigate (no camera on this laptop). Throwaway secrets inline on purpose.
services:
  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: lab-mqtt
    volumes:
      - lab-mqtt-config:/mosquitto/config
    ports:
      - "127.0.0.1:1883:1883"
  visitd:
    build:
      context: .
      dockerfile: visitd.Dockerfile
    image: camera-bridge/visitd:lab
    container_name: lab-visitd
    depends_on:
      - mqtt
    command: ["python", "-m", "visitd.main", "--dry-run"]
    environment:
      - VISITD_CONFIG=/config/config.yaml
      - VISITD_LEDGER=/data/visitd.sqlite
      - VISITD_METRICS_HOST=0.0.0.0
      - MQTT_USERNAME=visitd
      - MQTT_PASSWORD=labpass
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ./tests/fixtures:/lab/fixtures:ro
      - ./lab_publish.py:/lab/lab_publish.py:ro
      - lab-visitd-data:/data
volumes:
  lab-mqtt-config:
    external: true
  lab-visitd-data: {}
