# Mosquitto 2.0 for camera-bridge. Anonymous access is DISABLED (E10).
# Users live in /mosquitto/config/passwd, created on the host with mosquitto_passwd (README "Mosquitto bootstrap").
listener 1883
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# Frigate publishes small JSON payloads only; keep the broker from buffering runaway clients.
max_queued_messages 1000
message_size_limit 262144
